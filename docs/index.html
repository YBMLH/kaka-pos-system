<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAKA POS — Standalone</title>
<!--
  KAKA POS — Standalone single-file build.
  Runs 100% in the browser. All data is stored locally in this browser
  (localStorage) — nothing is sent anywhere. This is the GitHub-Pages /
  download-and-open build; the full multi-terminal version is the Flask app
  in the repository root. Default login: admin / admin123
-->
<style>
:root{--bg:#f4f6fb;--surface:#fff;--surface-2:#f8fafc;--border:#e2e8f0;--text:#1e293b;
--text-muted:#64748b;--primary:#1f6feb;--primary-dark:#1657c4;--success:#16a34a;
--warning:#d97706;--danger:#dc2626;--sidebar-bg:#0f172a;--sidebar-text:#cbd5e1;
--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 30px rgba(0,0,0,.15);--radius:10px;--radius-sm:6px;}
[data-theme="dark"]{--bg:#0b1120;--surface:#131c2e;--surface-2:#1a2438;--border:#263449;
--text:#e2e8f0;--text-muted:#94a3b8;--primary:#3b82f6;--sidebar-bg:#070c17;--sidebar-text:#94a3b8;
--shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 10px 30px rgba(0,0,0,.5);}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
[dir="rtl"] body,[dir="rtl"]{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
a{color:var(--primary);text-decoration:none;cursor:pointer}h1,h2,h3,h4{font-weight:600}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);
border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
label{font-size:13px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;padding:9px 16px;
border:1px solid transparent;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;
background:var(--surface-2);color:var(--text);transition:.15s;width:auto}
.btn:hover{filter:brightness(.97)}.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}.btn-ghost{background:transparent;border-color:var(--border)}
.btn-block{width:100%}.btn-sm{padding:5px 10px;font-size:12.5px}.btn-lg{padding:14px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.login-body{display:flex;align-items:center;justify-content:center;min-height:100vh;
background:linear-gradient(135deg,#1f6feb 0%,#0f172a 100%)}
.login-wrap{width:100%;max-width:400px;padding:20px}
.login-card{background:var(--surface);border-radius:16px;padding:36px 32px;box-shadow:var(--shadow-lg);text-align:center}
.login-logo{font-size:48px}.login-card h1{margin:8px 0 4px;font-size:22px}
.login-sub{color:var(--text-muted);margin-bottom:20px;font-size:13px}
.login-card label{display:block;text-align:start;font-size:13px;font-weight:500;margin:12px 0 4px;color:var(--text-muted)}
.login-error{background:#fee2e2;color:#b91c1c;padding:8px 12px;border-radius:6px;margin:12px 0;font-size:13px}
.login-hint{margin-top:16px;font-size:12px;color:var(--text-muted)}
.lang-switch{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.lang-switch button{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
padding:4px 12px;cursor:pointer;color:var(--text);width:auto}
.spinner{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--primary);
border-radius:50%;animation:spin .8s linear infinite;margin:80px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;
flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px;font-size:17px;font-weight:700;
color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}.brand-icon{font-size:22px}
.nav{flex:1;overflow-y:auto;padding:10px 0}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--sidebar-text);
font-size:14px;border-inline-start:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(31,111,235,.18);color:#fff;border-inline-start-color:var(--primary)}
.nav .nav-icon{font-size:17px;width:22px;text-align:center}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.user-chip{display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;
display:flex;align-items:center;justify-content:center;font-weight:600}
.user-name{color:#fff;font-size:13px;font-weight:600}.user-role{font-size:11px;color:var(--sidebar-text)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);
border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar h2{font-size:18px;flex:1}.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:38px;
height:38px;font-size:16px;cursor:pointer;color:var(--text)}.icon-btn:hover{background:var(--border)}
.mini-select{padding:7px 8px;width:auto}#menu-toggle{display:none}
.dropdown{position:relative}
.dropdown-menu{position:absolute;inset-inline-end:0;top:46px;background:var(--surface);
border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);min-width:180px;padding:6px;display:none;z-index:30}
.dropdown-menu.open{display:block}.dropdown-menu a{display:block;padding:9px 12px;border-radius:6px;color:var(--text)}
.dropdown-menu a:hover{background:var(--surface-2)}
.view{padding:22px;flex:1;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}.stats-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{color:var(--text-muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-size:26px;font-weight:700;margin-top:6px}.stat-sub{font-size:12.5px;margin-top:4px;color:var(--text-muted)}
.stat-accent-green{border-inline-start:4px solid var(--success)}.stat-accent-blue{border-inline-start:4px solid var(--primary)}
.stat-accent-orange{border-inline-start:4px solid var(--warning)}.stat-accent-red{border-inline-start:4px solid var(--danger)}
.up{color:var(--success)}.down{color:var(--danger)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.section-head h3{font-size:16px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:160px}.spacer{flex:1}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tbody tr:hover{background:var(--surface-2)}td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-green{background:rgba(22,163,74,.15);color:var(--success)}.badge-red{background:rgba(220,38,38,.15);color:var(--danger)}
.badge-orange{background:rgba(217,119,6,.15);color:var(--warning)}.badge-blue{background:rgba(31,111,235,.15);color:var(--primary)}
.badge-gray{background:var(--surface-2);color:var(--text-muted)}
.pos-layout{display:grid;grid-template-columns:1fr 400px;gap:16px;height:calc(100vh - 63px)}
.pos-left{display:flex;flex-direction:column;gap:12px;min-height:0;padding:16px}
.pos-search{position:relative}.pos-search input{font-size:16px;padding:14px 16px}
.pos-suggest{position:absolute;top:54px;inset-inline:0;background:var(--surface);border:1px solid var(--border);
border-radius:8px;box-shadow:var(--shadow-lg);max-height:320px;overflow-y:auto;z-index:40;display:none}
.pos-suggest.open{display:block}
.pos-suggest-item{display:flex;justify-content:space-between;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.pos-suggest-item:hover{background:var(--primary);color:#fff}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;overflow-y:auto;padding:4px}
.pos-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;text-align:center;transition:.12s}
.pos-tile:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}

.pos-tile .pt-price{color:var(--primary);font-weight:700;margin-top:6px}.pos-tile .pt-stock{font-size:11px;color:var(--text-muted)}
.cart{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;
flex-direction:column;height:calc(100vh - 63px - 32px);margin:16px}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-items{flex:1;overflow-y:auto;padding:8px}.cart-empty{text-align:center;color:var(--text-muted);padding:40px 10px}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:4px;padding:10px;border-bottom:1px solid var(--border)}
.cart-line .cl-name{font-weight:600;font-size:13px}.cart-line .cl-controls{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty-btn{width:26px;height:26px;border:1px solid var(--border);background:var(--surface-2);border-radius:6px;cursor:pointer;font-size:15px;color:var(--text)}
.cart-line input.cl-qty{width:52px;text-align:center;padding:4px}
.cart-line .cl-total{font-weight:700;text-align:end;align-self:center}.cl-remove{color:var(--danger);cursor:pointer;font-size:16px}
.cart-foot{border-top:1px solid var(--border);padding:14px 16px}
.cart-total-row{display:flex;justify-content:space-between;margin:3px 0}
.cart-total-row.grand{font-size:20px;font-weight:700;margin:8px 0}
.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column}
.modal.modal-lg{max-width:820px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:17px}.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.modal-close{cursor:pointer;font-size:22px;color:var(--text-muted);background:none;border:none;width:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.toast-root{position:fixed;bottom:20px;inset-inline-end:20px;display:flex;flex-direction:column;gap:10px;z-index:300}
.toast{background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--primary);
border-radius:8px;padding:12px 18px;box-shadow:var(--shadow-lg);min-width:240px;animation:slidein .25s ease}
.toast.success{border-inline-start-color:var(--success)}.toast.error{border-inline-start-color:var(--danger)}
@keyframes slidein{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.chart{display:flex;align-items:flex-end;gap:6px;height:200px;padding:10px 0}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart-bar{width:70%;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px}
.chart-bar.profit{background:var(--success)}.chart-label{font-size:10px;color:var(--text-muted);white-space:nowrap}
.health-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.health-green{background:var(--success)}.health-orange{background:var(--warning)}.health-red{background:var(--danger)}
.empty{text-align:center;color:var(--text-muted);padding:40px}.muted{color:var(--text-muted)}.right{text-align:end}
.mt{margin-top:16px}.mb{margin-bottom:16px}.flex{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.banner{background:rgba(31,111,235,.1);border:1px solid var(--primary);color:var(--text);
border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
@media(max-width:900px){.sidebar{position:fixed;inset-inline-start:0;z-index:60;transform:translateX(-100%);transition:transform .25s}
[dir="rtl"] .sidebar{transform:translateX(100%)}.sidebar.open{transform:none}#menu-toggle{display:block}
.pos-layout{grid-template-columns:1fr;height:auto}.cart{height:auto;margin:0}.form-grid{grid-template-columns:1fr}}
@media print{.sidebar,.topbar,.toast-root{display:none}.view{padding:0}}
</style>

<script>
"use strict";
/* ========================================================================
   KAKA POS — Standalone browser build. Data layer + app in one file.
   ======================================================================== */

/* ---------- Text normalization (accent/Arabic/typo-tolerant search) ------ */
var ARABIC_MAP={"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه"};
var ARABIC_DIAC=/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
function stripAccents(s){return s.normalize("NFKD").replace(/[̀-ͯ]/g,"");}
function normalize(s){if(!s)return"";s=(""+s).trim().toLowerCase();s=s.replace(ARABIC_DIAC,"");
  s=s.replace(/[؀-ۿ]/g,function(c){return ARABIC_MAP[c]||c;});s=stripAccents(s);
  return s.replace(/[^0-9a-z؀-ۿ]+/g,"");}
function searchBlob(){var out=[],seen={};for(var i=0;i<arguments.length;i++){var n=normalize(arguments[i]);
  if(n&&!seen[n]){seen[n]=1;out.push(n);}}return out.join(" ");}
function levenshtein(a,b){if(a===b)return 0;if(!a)return b.length;if(!b)return a.length;
  var prev=[];for(var j=0;j<=b.length;j++)prev[j]=j;
  for(var i=0;i<a.length;i++){var cur=[i+1];for(var k=0;k<b.length;k++){
    cur[k+1]=Math.min(prev[k+1]+1,cur[k]+1,prev[k]+(a[i]!==b[k]?1:0));}prev=cur;}return prev[b.length];}

/* ---------- Local data store (localStorage-backed) ---------------------- */
var STORE_KEY="kaka_pos_data_v1";
var ROLE_PERMS={
  administrator:["*"],
  manager:["dashboard","pos","products.view","products.edit","inventory","suppliers","customers",
    "purchases","expenses","reports","register","zakat","settings","edit_price","refund","discount","history"],
  cashier:["dashboard","pos","products.view","customers","register","discount","refund","history"],
  inventory:["dashboard","products.view","products.edit","inventory","suppliers","purchases"]
};
var ROLE_LABELS={administrator:"Administrator",manager:"Manager",cashier:"Cashier",inventory:"Inventory Employee"};

function hashPw(s){/* demo-grade only — client-side hashing is not real security */
  var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return "h"+(h>>>0).toString(16);}

var DB={
  data:null,
  load:function(){try{this.data=JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){this.data=null;}
    if(!this.data){this.seed();}return this.data;},
  save:function(){localStorage.setItem(STORE_KEY,JSON.stringify(this.data));},
  reset:function(){localStorage.removeItem(STORE_KEY);this.data=null;this.seed();},
  nextId:function(coll){var arr=this.data[coll],m=0;for(var i=0;i<arr.length;i++)if(arr[i].id>m)m=arr[i].id;return m+1;},
  seed:function(){
    var now=new Date().toISOString();
    var cats=["Beverages","Dairy","Bakery","Snacks","Cleaning","Cosmetics","Electronics","Phones","Clothing","Fruits & Vegetables"];
    var brands=["Coca Cola","Nestle","Samsung","Apple","Nike","Danone","P&G","Generic"];
    var products=[
      ["Coca Cola 1L","Coca Cola 1L","كوكا كولا 1 لتر","Beverages","Coca Cola",6,9,20,200,40,"pcs"],
      ["Mineral Water 1.5L","Eau Minérale 1.5L","ماء معدني 1.5 لتر","Beverages","Generic",2,4,20,300,60,"pcs"],
      ["Fresh Milk 1L","Lait Frais 1L","حليب طازج 1 لتر","Dairy","Danone",7,11,20,120,30,"pcs"],
      ["Yogurt Pack x4","Yaourt x4","زبادي 4 حبات","Dairy","Danone",8,13,20,90,20,"pcs"],
      ["White Bread","Pain Blanc","خبز أبيض","Bakery","Generic",1.5,3,0,80,20,"pcs"],
      ["Potato Chips 150g","Chips 150g","رقائق البطاطس","Snacks","Generic",5,8.5,20,150,30,"pcs"],
      ["Dish Soap 500ml","Liquide Vaisselle","سائل غسيل 500مل","Cleaning","P&G",9,15,20,60,15,"pcs"],
      ["Shampoo 400ml","Shampooing 400ml","شامبو 400مل","Cosmetics","P&G",18,29,20,45,10,"pcs"],
      ["USB-C Cable 1m","Câble USB-C 1m","كابل USB-C","Electronics","Generic",15,35,20,70,15,"pcs"],
      ["Wireless Earbuds","Écouteurs sans fil","سماعات لاسلكية","Electronics","Samsung",180,299,20,25,5,"pcs"],
      ["Samsung Galaxy A15","Samsung Galaxy A15","سامسونج A15","Phones","Samsung",1400,1899,20,12,3,"pcs"],
      ["Phone Case","Coque Téléphone","غطاء هاتف","Phones","Generic",12,30,20,100,20,"pcs"],
      ["Cotton T-Shirt","T-Shirt Coton","قميص قطني","Clothing","Nike",45,89,20,60,10,"pcs"],
      ["Running Shoes","Chaussures Sport","أحذية رياضية","Clothing","Nike",210,349,20,20,5,"pcs"],
      ["Bananas (kg)","Bananes (kg)","موز","Fruits & Vegetables","Generic",6,10,0,150,30,"kg"],
      ["Tomatoes (kg)","Tomates (kg)","طماطم","Fruits & Vegetables","Generic",4,7,0,120,25,"kg"]
    ];
    var d={settings:{store_name:"KAKA Market",store_address:"",store_phone:"",currency:"MAD",
      tax_rate:20,zakat_rate:2.5,language:"en",theme:"light",receipt_width:80,
      receipt_footer:"Thank you for your visit!"},
      users:[{id:1,username:"admin",full_name:"System Administrator",password:hashPw("admin123"),role:"administrator",active:1,last_login:null},
             {id:2,username:"cashier",full_name:"Demo Cashier",password:hashPw("cashier123"),role:"cashier",active:1,last_login:null}],
      categories:[],brands:[],suppliers:[
        {id:1,company_name:"Atlas Distribution",contact_person:"",category:"Beverages",phone1:"0522110011",whatsapp:"",email:"atlas@example.com",city:"",country:"",tax_number:"",address:"",notes:"",balance:0,active:1},
        {id:2,company_name:"Nord Food Supply",contact_person:"",category:"Dairy",phone1:"0522220022",whatsapp:"",email:"nord@example.com",city:"",country:"",tax_number:"",address:"",notes:"",balance:0,active:1},
        {id:3,company_name:"TechnoPro Import",contact_person:"",category:"Electronics",phone1:"0522330033",whatsapp:"",email:"techno@example.com",city:"",country:"",tax_number:"",address:"",notes:"",balance:0,active:1}],
      customers:[],products:[],sales:[],purchases:[],expenses:[],movements:[],registers:[],
      activity:[],counters:{sale:0,purchase:0}};
    cats.forEach(function(c,i){d.categories.push({id:i+1,name:c,name_ar:"",name_fr:""});});
    brands.forEach(function(b,i){d.brands.push({id:i+1,name:b});});
    var catId={};d.categories.forEach(function(c){catId[c.name]=c.id;});
    var brId={};d.brands.forEach(function(b){brId[b.name]=b.id;});
    products.forEach(function(p,i){
      var bc="611100000"+(1000+i*7);
      d.products.push({id:i+1,barcode:bc,sku:"SKU"+(1000+i),name_en:p[0],name_fr:p[1],name_ar:p[2],
        search_blob:searchBlob(p[0],p[1],p[2],bc),category_id:catId[p[3]],brand_id:brId[p[4]],
        supplier_id:((i%3)+1),purchase_price:p[5],selling_price:p[6],tax_rate:p[7],quantity:p[8],
        min_stock:p[9],unit:p[10],expiry_date:"",batch_number:"",notes:"",archived:0,created_at:now});
    });
    this.data=d;this.save();

function adjustStock(productId,change,reason,note){
  var p=DB.data.products.filter(function(x){return x.id===productId;})[0];if(!p)return null;
  p.quantity=(p.quantity||0)+change;
  DB.data.movements.unshift({id:DB.nextId("movements"),product_id:productId,product_name:p.name_en,
    change_qty:change,balance:p.quantity,reason:reason,note:note||"",
    user:SESSION.user?SESSION.user.username:"",created_at:new Date().toISOString()});
  return p.quantity;}

/* ---------- Product search --------------------------------------------- */
function searchProducts(term,limit){limit=limit||15;term=(term||"").trim();if(!term)return{products:[]};
  var exact=DB.data.products.filter(function(p){return p.barcode===term&&!p.archived;})[0];
  if(exact)return{products:[exact],exact_barcode:true};
  var norm=normalize(term);
  var rows=DB.data.products.filter(function(p){if(p.archived)return false;
    return(p.search_blob||"").indexOf(norm)>-1||(p.sku||"").toLowerCase().indexOf(term.toLowerCase())>-1||(p.barcode||"").indexOf(term)>-1;});
  rows.sort(function(a,b){function sc(r){var blob=r.search_blob||"";if(blob.indexOf(norm)===0)return 0;
    var best=99;blob.split(" ").forEach(function(tok){best=Math.min(best,levenshtein(norm,tok));});return 1+best/100;}
    return sc(a)-sc(b);});
  return{products:rows.slice(0,limit)};}
function serializeProduct(p){var d={};for(var k in p)d[k]=p[k];var sp=p.selling_price||0,pp=p.purchase_price||0;
  d.profit_margin=sp?Math.round((sp-pp)/sp*10000)/100:0;d.profit_unit=Math.round((sp-pp)*100)/100;
  d.low_stock=(p.quantity||0)<=(p.min_stock||0);
  var c=DB.data.categories.filter(function(x){return x.id===p.category_id;})[0];d.category_name=c?c.name:"";
  return d;}

/* ---------- Date/period analytics -------------------------------------- */
function completedSales(){return DB.data.sales.filter(function(s){return s.status==="completed"||s.status==="partial_refund";});}
function inPeriod(iso,period){var d=new Date(iso);var now=new Date();
  var dd=dnorm(iso);var td=today();
  if(period==="today")return dd===td;
  if(period==="yesterday"){var y=new Date();y.setDate(y.getDate()-1);return dd===y.toISOString().slice(0,10);}
  if(period==="week"){var monday=new Date();var day=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-day);
    monday.setHours(0,0,0,0);return d>=monday;}
  if(period==="month")return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(period==="quarter")return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/3)===Math.floor(now.getMonth()/3);
  if(period==="half")return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/6)===Math.floor(now.getMonth()/6);
  if(period==="year")return d.getFullYear()===now.getFullYear();
  return true;}
function salesMetrics(filterFn){var m={orders:0,revenue:0,cost:0,gross_profit:0,tax:0,discount:0};
  completedSales().forEach(function(s){if(filterFn&&!filterFn(s))return;m.orders++;m.revenue+=s.total;
    m.cost+=s.cost_total;m.gross_profit+=s.profit;m.tax+=s.tax;m.discount+=s.discount;});
  ["revenue","cost","gross_profit","tax","discount"].forEach(function(k){m[k]=Math.round(m[k]*100)/100;});return m;}

function inventoryValue(){var cost=0,retail=0,units=0,count=0;
  DB.data.products.forEach(function(p){if(p.archived)return;count++;units+=p.quantity;
    cost+=p.quantity*p.purchase_price;retail+=p.quantity*p.selling_price;});
  return{cost_value:Math.round(cost*100)/100,retail_value:Math.round(retail*100)/100,total_units:units,products:count};}

/* ======================================================================
   Shell, navigation, boot
   ====================================================================== */
var NAV=[["dashboard","📊","dashboard"],["pos","🛒","pos"],["products","📦","products.view"],["inventory","📋","inventory"],
  ["purchases","🚚","purchases"],["suppliers","🏭","suppliers"],["customers","👥","customers"],["history","🧾","history"],
  ["expenses","💸","expenses"],["reports","📈","reports"],["register","💰","register"],["zakat","🕌","zakat"],
  ["users","🔐","*"],["settings","⚙️","settings"]];
function navLabel(id){var k="nav."+id;var v=t(k);return v!==k?v:(id.charAt(0).toUpperCase()+id.slice(1));}

function applyLang(lang){SESSION.lang=lang;localStorage.setItem("kaka_lang",lang);
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";}
function applyTheme(theme){SESSION.theme=theme;localStorage.setItem("kaka_theme",theme);document.body.setAttribute("data-theme",theme);}

function renderLogin(){var root=document.getElementById("root");
  applyLang(SESSION.lang);applyTheme(SESSION.theme);
  document.body.className="login-body";
  root.innerHTML="";
  var err=el("div",{class:"login-error",hidden:true});
  var user=el("input",{type:"text",id:"lg-user",value:""});var pass=el("input",{type:"password",id:"lg-pass"});
  var card=el("form",{class:"login-card",onSubmit:function(e){e.preventDefault();
    if(login(user.value.trim(),pass.value)){boot();}else{err.textContent=t("login.invalid");err.hidden=false;}}},[
    el("div",{class:"login-logo",text:"🛒"}),el("h1",{text:DB.data.settings.store_name||"KAKA POS"}),
    el("p",{class:"login-sub",text:t("login.subtitle")}),
    el("div",{class:"lang-switch"},["en","fr","ar"].map(function(l){return el("button",{type:"button",text:l==="ar"?"ع":l.toUpperCase(),
      onClick:function(){applyLang(l);renderLogin();}});})),
    el("label",{text:t("login.username")}),user,el("label",{text:t("login.password")}),pass,err,
    el("button",{type:"submit",class:"btn btn-primary btn-block",text:t("login.signin")}),
    el("p",{class:"login-hint",html:"Default admin — <strong>admin / admin123</strong>"})]);
  root.appendChild(el("div",{class:"login-wrap"},card));}

function renderShell(){var root=document.getElementById("root");document.body.className="";clear(root);
  var nav=el("nav",{class:"nav",id:"nav"});
  NAV.forEach(function(item){if(!can(item[2]))return;nav.appendChild(el("a",{href:"#/"+item[0],"data-view":item[0]},
    [el("span",{class:"nav-icon",text:item[1]}),el("span",{text:navLabel(item[0])})]));});
  var u=SESSION.user;
  var sidebar=el("aside",{class:"sidebar",id:"sidebar"},[el("div",{class:"brand"},[el("span",{class:"brand-icon",text:"🛒"}),
    el("span",{text:DB.data.settings.store_name||"KAKA POS"})]),nav,
    el("div",{class:"sidebar-footer"},el("div",{class:"user-chip"},[el("span",{class:"user-avatar",text:(u.username[0]||"U").toUpperCase()}),
      el("div",{},[el("div",{class:"user-name",text:u.full_name||u.username}),el("div",{class:"user-role",text:ROLE_LABELS[u.role]})])]))]);
  var langSel=el("select",{class:"mini-select",title:"Language"},["en","fr","ar"].map(function(l){return el("option",{value:l},l==="ar"?"ع":l.toUpperCase());}));
  langSel.value=SESSION.lang;langSel.addEventListener("change",function(){applyLang(langSel.value);renderShell();route();});
  var userMenu=el("div",{class:"dropdown-menu",id:"user-menu"},[el("a",{text:t("menu.change_password"),onClick:changePassword}),el("a",{text:t("menu.logout"),onClick:function(){logout();renderLogin();}})]);
  var topbar=el("header",{class:"topbar"},[el("button",{class:"icon-btn",id:"menu-toggle",text:"☰",onClick:function(){document.getElementById("sidebar").classList.toggle("open");}}),
    el("h2",{id:"page-title"}),el("div",{class:"topbar-actions"},[langSel,
      el("button",{class:"icon-btn",title:"Theme",text:"🌓",onClick:function(){applyTheme(SESSION.theme==="light"?"dark":"light");}}),
      el("div",{class:"dropdown"},[el("button",{class:"icon-btn",text:"⚙️",onClick:function(e){e.stopPropagation();userMenu.classList.toggle("open");}}),userMenu])])]);
  document.addEventListener("click",function(){userMenu.classList.remove("open");});
  root.appendChild(el("div",{class:"app-shell"},[sidebar,el("div",{class:"main"},[topbar,el("main",{class:"view",id:"view"})])]));}

function changePassword(){var form=buildForm([{name:"current",label:"Current Password",type:"password",full:true},
  {name:"next",label:"New Password",type:"password",full:true}]);
  modal(t("menu.change_password"),form.node,[{label:t("common.cancel"),class:"btn-ghost"},{label:t("common.save"),class:"btn-primary",onClick:function(){var v=form.values();
    if(SESSION.user.password!==hashPw(v.current)){toast("Current password is incorrect","error");return false;}
    if(v.next.length<6){toast("New password must be 6+ characters","error");return false;}
    SESSION.user.password=hashPw(v.next);DB.save();log("change_password","user","");toast("Password changed","success");}}]);}

function route(){var id=(location.hash||"#/dashboard").replace("#/","")||"dashboard";
  var item=NAV.filter(function(i){return i[0]===id;})[0];
  if(!item||!can(item[2])||!VIEWS[id]){id="dashboard";if(!can("dashboard")){var first=NAV.filter(function(i){return can(i[2]);})[0];if(first)id=first[0];}}
  var links=document.querySelectorAll("#nav a");for(var i=0;i<links.length;i++)links[i].classList.toggle("active",links[i].getAttribute("data-view")===id);
  document.getElementById("page-title").textContent=VIEWS[id].title();
  document.getElementById("sidebar").classList.remove("open");var view=document.getElementById("view");view.scrollTop=0;
  try{VIEWS[id].render(view);}catch(e){view.innerHTML='<div class="empty">Error: '+esc(e.message)+"</div>";console.error(e);}}

function boot(){DB.load();
  if(!SESSION.user){renderLogin();return;}
  applyLang(SESSION.user_lang||SESSION.lang);applyTheme(SESSION.theme);
  renderShell();
  window.onhashchange=route;
  if(!location.hash)location.hash="#/dashboard";route();}

DB.load();boot();
</script>
