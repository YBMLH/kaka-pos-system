<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAKA POS — Standalone</title>
<!--
  KAKA POS — Standalone single-file build.
  Runs 100% in the browser. All data is stored locally in this browser
  (localStorage) — nothing is sent anywhere. This is the GitHub-Pages /
  download-and-open build; the full multi-terminal version is the Flask app
  in the repository root. Default login: admin / admin123
-->
<style>
/* ===== KAKA POS — design system ===================================== */
:root{
  --mag:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-4.2-4.2'/%3E%3C/svg%3E");
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
  --border:#e4e9f0; --border-strong:#cfd8e3;
  --text:#0f172a; --text-muted:#64748b; --text-soft:#94a3b8;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
  --success:#059669; --success-soft:#ecfdf5;
  --warning:#d97706; --warning-soft:#fffbeb;
  --danger:#e11d48; --danger-soft:#fff1f2;
  --info:#0284c7;
  --sidebar-bg:#111827; --sidebar-text:#9ca3af; --sidebar-hover:#1f2937;
  --shadow-xs:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 1px 3px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 16px 48px rgba(15,23,42,.18);
  --radius:14px; --radius-sm:10px; --radius-xs:8px; --radius-pill:999px;
  --fs:14px;
}
[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#121a2a; --surface-2:#182135; --surface-3:#1e293f;
  --border:#25314a; --border-strong:#35425e;
  --text:#e8edf7; --text-muted:#94a3b8; --text-soft:#64748b;
  --primary:#6366f1; --primary-dark:#818cf8; --primary-soft:#1e2440;
  --success:#10b981; --success-soft:#0d2a22;
  --warning:#f59e0b; --warning-soft:#2a2113;
  --danger:#fb7185; --danger-soft:#2d1520;
  --sidebar-bg:#070c17; --sidebar-text:#8593a8; --sidebar-hover:#161f33;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.55;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
[dir="rtl"] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
a{color:var(--primary);text-decoration:none;cursor:pointer}
h1,h2,h3,h4{font-weight:650;letter-spacing:-.02em;line-height:1.3}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-soft);background-clip:content-box}

/* ---- Forms ---- */
input,select,textarea{font-family:inherit;font-size:var(--fs);padding:10px 13px;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);
  color:var(--text);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--primary) 16%,transparent)}
input::placeholder{color:var(--text-soft)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:32px}
[dir="rtl"] select{background-position:16px 52%,21px 52%}
label{font-size:12.5px;color:var(--text-muted);font-weight:550}
.field{display:flex;flex-direction:column;gap:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:10px 16px;
  border:1.5px solid transparent;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;
  cursor:pointer;background:var(--surface-2);color:var(--text);width:auto;white-space:nowrap;
  transition:transform .12s,box-shadow .15s,background .15s,border-color .15s;font-family:inherit}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn-soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:var(--radius-xs)}
.btn-lg{padding:15px 22px;font-size:15.5px;border-radius:var(--radius)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  width:38px;height:38px;font-size:15px;cursor:pointer;color:var(--text);display:inline-flex;
  align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.mini-select{padding:8px 30px 8px 11px;width:auto;font-size:13px;font-weight:600}
.lock-screen{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  padding:20px;background:radial-gradient(1000px 500px at 20% 10%,#4f46e5 0%,transparent 55%),
  radial-gradient(800px 450px at 80% 90%,#0ea5e9 0%,transparent 50%),rgba(8,12,22,.97);
  backdrop-filter:blur(4px)}
.wiz-dots{display:flex;gap:7px;margin:12px 0 18px}
.wiz-dot{width:34px;height:5px;border-radius:99px;background:var(--border)}
.wiz-dot.active{background:var(--primary)}
.wiz-dot.done{background:color-mix(in srgb,var(--primary) 45%,transparent)}
.choice{display:flex;gap:14px;align-items:center;padding:16px;border:2px solid var(--border);
  border-radius:var(--radius);cursor:pointer;margin-bottom:10px;transition:.15s;background:var(--surface)}
.choice:hover{border-color:var(--border-strong)}
.choice.active{border-color:var(--primary);background:var(--primary-soft)}
.save-chip{border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-muted);
  border-radius:var(--radius-pill);padding:7px 13px;font-size:12px;font-weight:650;cursor:pointer;
  font-family:inherit;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.save-chip:hover{border-color:var(--border-strong)}
.save-chip.ok{background:var(--success-soft);color:var(--success);border-color:transparent}
.save-chip.warn{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.save-chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
@media(max-width:900px){.save-chip{max-width:110px}}

/* ---- Login ---- */
.login-body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:radial-gradient(1200px 600px at 15% 10%,#4f46e5 0%,transparent 55%),
             radial-gradient(900px 500px at 85% 85%,#0ea5e9 0%,transparent 50%),#0b1120}
.login-wrap{width:100%;max-width:410px}
.login-card{background:var(--surface);border-radius:22px;padding:38px 34px;box-shadow:var(--shadow-lg);text-align:center}
.login-logo{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;display:flex;align-items:center;
  justify-content:center;font-size:30px;background:linear-gradient(135deg,var(--primary),#0ea5e9);
  color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 40%,transparent)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-sub{color:var(--text-muted);margin-bottom:22px;font-size:13px}
.login-card label{display:block;text-align:start;margin:14px 0 0;font-weight:600}
.login-card input{margin-top:6px}
.login-error{background:var(--danger-soft);color:var(--danger);padding:10px 13px;border-radius:var(--radius-sm);
  margin-top:14px;font-size:13px;font-weight:550}
.login-card .btn{margin-top:20px}
.login-hint{margin-top:18px;font-size:12px;color:var(--text-soft)}
.lang-switch{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.lang-switch button{background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-pill);
  padding:5px 14px;cursor:pointer;color:var(--text-muted);font-weight:600;font-size:12.5px;font-family:inherit;transition:.15s}
.lang-switch button:hover{border-color:var(--primary);color:var(--primary)}
.spinner{width:40px;height:40px;border:3.5px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;margin:80px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- App shell ---- */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--sidebar-bg);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;flex-shrink:0;z-index:50}
.brand{display:flex;align-items:center;gap:11px;padding:18px 20px 16px;color:#fff}
.brand-icon{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#0ea5e9);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-tag{font-size:10.5px;color:var(--sidebar-text);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav::-webkit-scrollbar{width:6px}
.nav-group-label{font-size:10px;font-weight:700;color:var(--sidebar-text);opacity:.6;
  text-transform:uppercase;letter-spacing:.09em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;color:var(--sidebar-text);
  font-size:13.5px;font-weight:550;border-radius:var(--radius-xs);margin-bottom:2px;transition:.13s}
.nav a:hover{background:var(--sidebar-hover);color:#fff}
.nav a.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 35%,transparent)}
.nav .nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-inline-start:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  border-radius:var(--radius-pill);padding:1px 6px;min-width:18px;text-align:center}
.nav a.active .nav-badge{background:rgba(255,255,255,.25)}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);background:rgba(255,255,255,.04)}
.user-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#0ea5e9);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.user-name{color:#fff;font-size:13px;font-weight:600;line-height:1.2}
.user-role{font-size:11px;color:var(--sidebar-text)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar h2{font-size:17.5px;line-height:1.2}
.page-sub{font-size:12px;color:var(--text-muted);font-weight:500}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
#menu-toggle{display:none}
.dropdown{position:relative}
.dropdown-menu{position:absolute;inset-inline-end:0;top:46px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  min-width:200px;padding:6px;display:none;z-index:30}
.dropdown-menu.open{display:block;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dropdown-menu a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--radius-xs);
  color:var(--text);font-size:13.5px;font-weight:550}
.dropdown-menu a:hover{background:var(--surface-2)}
.view{padding:24px;flex:1;overflow-y:auto}

/* ---- Cards, stats ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-xs)}
.grid{display:grid;gap:16px}
.stats-grid{grid-template-columns:repeat(auto-fit,minmax(206px,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-xs);transition:.16s;position:relative;overflow:hidden}
.stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.stat-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px}
.stat-label{color:var(--text-muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.stat-value{font-size:25px;font-weight:720;letter-spacing:-.03em;line-height:1.15}
.stat-sub{font-size:12px;margin-top:5px;color:var(--text-soft);font-weight:500}
.stat-accent-blue .stat-icon{background:var(--primary-soft);color:var(--primary)}
.stat-accent-green .stat-icon{background:var(--success-soft);color:var(--success)}
.stat-accent-orange .stat-icon{background:var(--warning-soft);color:var(--warning)}
.stat-accent-red .stat-icon{background:var(--danger-soft);color:var(--danger)}
.up{color:var(--success);font-weight:650}.down{color:var(--danger);font-weight:650}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-head h3{font-size:15.5px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .grow{flex:1;min-width:180px}
.spacer{flex:1}
.hint{font-size:12.5px;color:var(--text-muted)}

/* ---- Search field with icon ---- */
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{padding-inline-start:38px}
.search-wrap::before{content:"";position:absolute;inset-inline-start:13px;top:50%;
  width:15px;height:15px;transform:translateY(-50%);pointer-events:none;opacity:.45;
  background:currentColor;color:var(--text-muted);
  -webkit-mask:var(--mag) center/contain no-repeat;mask:var(--mag) center/contain no-repeat}

/* ---- Chips / segmented ---- */
.chip-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 13px;border-radius:var(--radius-pill);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:.14s;font-family:inherit}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---- Tables ---- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-xs)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:12px 16px;text-align:start;white-space:nowrap}
th{background:var(--surface-2);color:var(--text-muted);font-weight:650;font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;border-bottom:1px solid var(--border)}
td{border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.t-main{font-weight:600}
.t-sub{font-size:11.5px;color:var(--text-soft);margin-top:2px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-pill);
  font-size:11.5px;font-weight:650;letter-spacing:.01em}
.badge-green{background:var(--success-soft);color:var(--success)}
.badge-red{background:var(--danger-soft);color:var(--danger)}
.badge-orange{background:var(--warning-soft);color:var(--warning)}
.badge-blue{background:var(--primary-soft);color:var(--primary)}
.badge-gray{background:var(--surface-3);color:var(--text-muted)}

/* ---- POS ---- */
.pos-layout{display:grid;grid-template-columns:1fr 420px;gap:0;height:calc(100vh - 67px)}
.pos-left{display:flex;flex-direction:column;gap:14px;min-height:0;padding:20px;overflow:hidden}
.pos-search{position:relative;flex-shrink:0}
.pos-search input{font-size:16px;padding:15px 56px 15px 46px;border-radius:var(--radius);
  box-shadow:var(--shadow-xs);border-width:2px}
[dir="rtl"] .pos-search input{padding:15px 46px 15px 56px}
.pos-search::before{content:"";position:absolute;inset-inline-start:16px;top:50%;
  width:18px;height:18px;transform:translateY(-50%);pointer-events:none;opacity:.45;
  background:currentColor;color:var(--text-muted);
  -webkit-mask:var(--mag) center/contain no-repeat;mask:var(--mag) center/contain no-repeat}
.pos-suggest{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  max-height:340px;overflow-y:auto;z-index:40;display:none;padding:6px}
.pos-suggest.open{display:block}
.pos-suggest-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 13px;cursor:pointer;border-radius:var(--radius-xs);transition:.1s}
.pos-suggest-item:hover,.pos-suggest-item.active{background:var(--primary);color:#fff}
.pos-suggest-item:hover .muted,.pos-suggest-item.active .muted{color:rgba(255,255,255,.8)}
.pos-scroll{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:11px;padding-bottom:8px}
.pos-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px;cursor:pointer;text-align:start;transition:.15s;box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;gap:2px;position:relative}
.pos-tile:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.pos-tile:active{transform:translateY(-1px)}
.pt-thumb{width:100%;height:56px;border-radius:var(--radius-xs);margin-bottom:8px;display:flex;
  align-items:center;justify-content:center;font-size:24px;background:var(--surface-3)}
.pt-name{font-weight:620;font-size:12.5px;line-height:1.35;height:34px;overflow:hidden;color:var(--text)}
.pt-price{color:var(--primary);font-weight:720;font-size:14.5px;margin-top:4px}
.pt-stock{font-size:11px;color:var(--text-soft);font-weight:550}
.pt-low{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--warning)}
.pt-box{margin-top:8px;width:100%;border:1.5px dashed var(--border-strong);background:var(--surface-2);
  color:var(--text-muted);border-radius:var(--radius-xs);padding:5px 6px;font-size:10.5px;font-weight:650;
  cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-box:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);border-style:solid}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px;
  max-height:190px;overflow-y:auto;padding:8px;background:var(--surface-2);border-radius:var(--radius-sm);
  border:1px solid var(--border)}
.emoji-opt{font-size:20px;line-height:1;padding:7px 0;border:1.5px solid transparent;border-radius:var(--radius-xs);
  background:transparent;cursor:pointer;transition:.12s;font-family:inherit}
.emoji-opt:hover{background:var(--surface);border-color:var(--border-strong)}
.emoji-opt.active{background:var(--primary-soft);border-color:var(--primary)}
.thumb-sm{width:34px;height:34px;border-radius:8px;background:var(--surface-3);display:flex;
  align-items:center;justify-content:center;font-size:17px;flex-shrink:0}

.cart{background:var(--surface);border-inline-start:1px solid var(--border);display:flex;
  flex-direction:column;height:calc(100vh - 67px)}
.cart-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cart-head h3{font-size:15px}
.cart-items{flex:1;overflow-y:auto;padding:8px 10px}
.cart-empty{text-align:center;color:var(--text-soft);padding:48px 16px;font-size:13.5px}
.cart-empty .ce-icon{font-size:38px;display:block;margin-bottom:10px;opacity:.35}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 10px;
  border-radius:var(--radius-sm);transition:background .12s}
.cart-line:hover{background:var(--surface-2)}
.cart-line+.cart-line{border-top:1px solid var(--border)}
.cl-name{font-weight:620;font-size:13px;line-height:1.35}
.cl-controls{display:flex;align-items:center;gap:6px;margin-top:7px}
.qty-btn{width:28px;height:28px;border:1.5px solid var(--border);background:var(--surface);
  border-radius:var(--radius-xs);cursor:pointer;font-size:15px;color:var(--text);font-weight:600;
  display:flex;align-items:center;justify-content:center;transition:.13s;flex-shrink:0;font-family:inherit}
.qty-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.cart-line input.cl-qty{width:54px;text-align:center;padding:5px;font-weight:650;font-size:13px}
.cl-total{font-weight:700;text-align:end;align-self:center;font-size:14px;font-variant-numeric:tabular-nums}
.cl-remove{color:var(--text-soft);cursor:pointer;font-size:14px;text-align:end;margin-top:6px;transition:.13s}
.cl-remove:hover{color:var(--danger)}
.cart-foot{border-top:1px solid var(--border);padding:16px 18px;background:var(--surface-2)}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin:5px 0;font-size:13.5px;color:var(--text-muted)}
.cart-total-row span:last-child{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.cart-total-row.grand{font-size:21px;font-weight:750;margin:12px 0 4px;padding-top:12px;
  border-top:1.5px dashed var(--border-strong);color:var(--text);letter-spacing:-.02em}
.cart-total-row.grand span:last-child{font-weight:750;font-size:21px;color:var(--primary)}
.cart-actions{display:grid;grid-template-columns:auto 1fr;gap:9px;margin-top:14px}

/* ---- Modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(8,12,22,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;
  max-width:520px;max-height:92vh;display:flex;flex-direction:column;animation:rise .2s cubic-bezier(.3,1.3,.5,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal.modal-lg{max-width:840px}
.modal-head{padding:18px 22px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{font-size:16.5px}
.modal-body{padding:4px 22px 20px;overflow-y:auto}
.modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.modal-close{cursor:pointer;font-size:20px;color:var(--text-soft);background:var(--surface-2);border:none;
  width:32px;height:32px;border-radius:var(--radius-xs);flex-shrink:0;transition:.14s;line-height:1}
.modal-close:hover{background:var(--surface-3);color:var(--text)}

/* ---- Toast ---- */
.toast-root{position:fixed;bottom:22px;inset-inline-end:22px;display:flex;flex-direction:column;gap:10px;
  z-index:300;pointer-events:none}   /* must never block the Charge button */
.toast{background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--primary);
  border-radius:var(--radius-sm);padding:13px 18px;box-shadow:var(--shadow-lg);min-width:250px;
  max-width:360px;font-size:13.5px;font-weight:550;animation:slidein .22s cubic-bezier(.3,1.2,.5,1);transition:opacity .3s}
.toast.success{border-inline-start-color:var(--success)}
.toast.error{border-inline-start-color:var(--danger)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ---- Charts ---- */
.chart{display:flex;align-items:flex-end;gap:5px;height:210px;padding:12px 0 0}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.chart-bar{width:100%;background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 65%,transparent));
  border-radius:5px 5px 2px 2px;min-height:3px;transition:.25s;cursor:pointer}
.chart-bar:hover{filter:brightness(1.15)}
.chart-bar.profit{background:linear-gradient(180deg,var(--success),color-mix(in srgb,var(--success) 60%,transparent))}
.chart-label{font-size:9.5px;color:var(--text-soft);white-space:nowrap;font-weight:550}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text-muted);font-weight:550}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:5px}

/* ---- Misc ---- */
.health-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.health-green{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.health-orange{background:var(--warning);box-shadow:0 0 0 3px var(--warning-soft)}
.health-red{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.empty{text-align:center;color:var(--text-soft);padding:44px 20px;font-size:13.5px}
.muted{color:var(--text-muted)}
.right{text-align:end}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.flex{display:flex;gap:9px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:5px;border-radius:var(--radius);
  margin-bottom:20px;flex-wrap:wrap;border:1px solid var(--border)}
.tab{padding:8px 15px;cursor:pointer;border-radius:var(--radius-xs);color:var(--text-muted);
  font-size:13px;font-weight:600;transition:.14s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);background:var(--surface);box-shadow:var(--shadow-xs)}
.banner{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);
  color:var(--text);border-radius:var(--radius-sm);padding:12px 15px;font-size:13px;margin-bottom:16px;font-weight:500}
.banner-warn{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 30%,transparent)}
kbd{background:var(--surface-3);border:1px solid var(--border-strong);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:11px;font-family:ui-monospace,monospace;font-weight:600;color:var(--text-muted)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}

/* ---- Responsive ---- */
@media(max-width:1100px){.pos-layout{grid-template-columns:1fr 360px}}
@media(max-width:900px){
  .sidebar{position:fixed;inset-inline-start:0;transform:translateX(-100%);transition:transform .24s ease;box-shadow:var(--shadow-lg)}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  #menu-toggle{display:inline-flex}
  .pos-layout{grid-template-columns:1fr;height:auto}
  .cart{height:auto;border-inline-start:none;border-top:1px solid var(--border)}
  .form-grid{grid-template-columns:1fr}
  .view{padding:16px}
  .topbar{padding:12px 16px}
  .toast-root{inset-inline:14px;bottom:14px}
  .toast{max-width:none}
}
@media print{.sidebar,.topbar,.toast-root,.toolbar,.cart-actions{display:none!important}.view{padding:0}}

/* ═══════════════════════════════════════════════════════════════════════
   APPLE-STYLE GLASS LAYER
   Layered translucent surfaces over a soft mesh background, SF typography,
   Apple system accents. Loaded after the base rules so it overrides them.
   Blur is applied only to large structural surfaces — never to list rows or
   the 60 product tiles — so it stays smooth on modest shop hardware.
   "Reduce transparency" (Settings) turns every glass surface solid.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#007AFF; --accent-2:#5856D6;
  --primary:#007AFF; --primary-dark:#0062CC;
  --primary-soft:rgba(0,122,255,.12);
  --success:#28A745; --success-soft:rgba(40,167,69,.13);
  --warning:#FF9500; --warning-soft:rgba(255,149,0,.15);
  --danger:#FF3B30;  --danger-soft:rgba(255,59,48,.13);
  --text:#1D1D1F; --text-muted:#6E6E73; --text-soft:#8E8E93;
  --glass:rgba(255,255,255,.66);
  --glass-strong:rgba(255,255,255,.80);
  --glass-line:rgba(255,255,255,.75);
  --glass-edge:rgba(0,0,0,.06);
  --blur:22px;
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 16px rgba(0,0,0,.06);
  --shadow-md:0 10px 30px rgba(0,0,0,.09);
  --shadow-lg:0 24px 70px rgba(0,0,0,.20);
  --sidebar-text:rgba(235,235,245,.62);
}
[data-theme="dark"]{
  --accent:#0A84FF; --accent-2:#5E5CE6;
  --primary:#0A84FF; --primary-dark:#409CFF;
  --primary-soft:rgba(10,132,255,.20);
  --success:#30D158; --success-soft:rgba(48,209,88,.16);
  --warning:#FF9F0A; --warning-soft:rgba(255,159,10,.16);
  --danger:#FF453A;  --danger-soft:rgba(255,69,58,.16);
  --text:#F5F5F7; --text-muted:rgba(235,235,245,.62); --text-soft:rgba(235,235,245,.40);
  --glass:rgba(28,28,32,.62);
  --glass-strong:rgba(30,30,36,.78);
  --glass-line:rgba(255,255,255,.10);
  --glass-edge:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.10);
  --border-strong:rgba(255,255,255,.18);
  --surface-2:rgba(255,255,255,.06);
  --surface-3:rgba(255,255,255,.10);
  --shadow-lg:0 24px 70px rgba(0,0,0,.65);
}

/* Mesh background — what the glass actually refracts */
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
    "Segoe UI Variable","Segoe UI",Inter,Roboto,"Noto Sans Arabic",sans-serif;
  letter-spacing:-.01em;
  background:
    radial-gradient(1100px 700px at 8% -5%,  rgba(0,122,255,.16), transparent 60%),
    radial-gradient(900px 650px at 100% 0%,  rgba(88,86,214,.14), transparent 58%),
    radial-gradient(900px 700px at 50% 108%, rgba(255,149,0,.10), transparent 60%),
    #F2F3F7;
  background-attachment:fixed;
}
body[data-theme="dark"]{
  background:
    radial-gradient(1100px 700px at 8% -5%,  rgba(10,132,255,.20), transparent 60%),
    radial-gradient(900px 650px at 100% 0%,  rgba(94,92,230,.18), transparent 58%),
    radial-gradient(900px 700px at 50% 108%, rgba(255,159,10,.10), transparent 60%),
    #0B0B0F;
  background-attachment:fixed;
}

/* ---- Glass surfaces (blurred: structural only) ---- */
.sidebar{
  background:linear-gradient(180deg,rgba(22,22,26,.82),rgba(16,16,20,.88));
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-inline-end:1px solid rgba(255,255,255,.08);
}
body:not([data-theme="dark"]) .sidebar{
  background:linear-gradient(180deg,rgba(28,28,32,.84),rgba(18,18,22,.90));
}
.topbar{
  background:var(--glass-strong);
  backdrop-filter:blur(var(--blur)) saturate(190%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(190%);
  border-bottom:1px solid var(--glass-edge);
}
.card,.stat,.table-wrap,.tabs,.pos-suggest,.dropdown-menu,.modal,.toast,.emoji-grid{
  background:var(--glass);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--shadow),inset 0 1px 0 var(--glass-line);
}
.cart{
  background:var(--glass-strong);
  backdrop-filter:blur(26px) saturate(190%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  border-inline-start:1px solid var(--glass-edge);
}
.cart-foot{background:transparent;border-top:1px solid var(--glass-edge)}
.modal{border-radius:22px;box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-line)}
.modal-overlay{background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.login-card{
  background:var(--glass-strong);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-line);
}

/* Tiles and rows: translucent but NOT blurred (there can be 60 of them) */
.pos-tile{
  background:var(--glass);
  border:1px solid var(--glass-edge);
  box-shadow:var(--shadow-xs),inset 0 1px 0 var(--glass-line);
}
.pos-tile:hover{
  background:var(--glass-strong);
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  box-shadow:var(--shadow-md);
}
.pt-thumb{background:rgba(120,120,128,.10)}
th{background:transparent;backdrop-filter:none;border-bottom:1px solid var(--glass-edge)}
td{border-bottom:1px solid var(--glass-edge)}
tbody tr:hover{background:rgba(120,120,128,.08)}

/* ---- Controls ---- */
.btn{border-radius:12px;font-weight:590;letter-spacing:-.01em;
  box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-primary{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 86%,#000));
  color:#fff;border:none;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 34%,transparent)}
.btn-success{background:linear-gradient(180deg,var(--success),color-mix(in srgb,var(--success) 85%,#000));
  color:#fff;border:none;box-shadow:0 4px 14px color-mix(in srgb,var(--success) 32%,transparent)}
.btn-danger{background:linear-gradient(180deg,var(--danger),color-mix(in srgb,var(--danger) 85%,#000));
  color:#fff;border:none;box-shadow:0 4px 14px color-mix(in srgb,var(--danger) 30%,transparent)}
.btn-ghost{background:rgba(120,120,128,.10);border:1px solid var(--glass-edge);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:rgba(120,120,128,.16)}
.btn-soft{background:var(--primary-soft);color:var(--accent);border:none}
.icon-btn{background:rgba(120,120,128,.10);border:1px solid var(--glass-edge);border-radius:11px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.icon-btn:hover{background:rgba(120,120,128,.18)}
input,select,textarea{
  background:rgba(255,255,255,.55);border:1px solid var(--glass-edge);border-radius:11px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{
  background:rgba(255,255,255,.07)}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);background:var(--glass-strong);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.chip{background:rgba(120,120,128,.10);border:1px solid var(--glass-edge);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:560}
.chip{color:var(--text)}
.chip:hover{background:rgba(120,120,128,.20)}
.chip.active{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 86%,#000));
  border-color:transparent;color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 32%,transparent)}
.nav a.active{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));
  box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.nav a:hover:not(.active){background:rgba(255,255,255,.08)}
.brand-icon,.login-logo,.user-avatar{
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.tab.active{background:var(--glass-strong);box-shadow:var(--shadow-xs)}
.tabs{padding:4px;border-radius:14px}
.badge{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.save-chip{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:99px}
.banner{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px}
.banner-warn{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 30%,transparent)}
.cart-total-row.grand span:last-child{color:var(--accent)}
.pt-price{color:var(--accent)}
.login-body{background:
  radial-gradient(900px 600px at 15% 8%,rgba(0,122,255,.55),transparent 58%),
  radial-gradient(800px 600px at 85% 92%,rgba(88,86,214,.50),transparent 55%),#0A0A0F}
.lock-screen{background:
  radial-gradient(900px 600px at 20% 10%,rgba(0,122,255,.40),transparent 58%),
  radial-gradient(800px 550px at 80% 90%,rgba(88,86,214,.36),transparent 55%),rgba(10,10,15,.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}

/* ═══ Reduce transparency — Apple's own accessibility escape hatch.
       Also the right setting for weak hardware or bright shop lighting. ═══ */
[data-reduce-transparency="1"] .sidebar,
[data-reduce-transparency="1"] .topbar,
[data-reduce-transparency="1"] .card,
[data-reduce-transparency="1"] .stat,
[data-reduce-transparency="1"] .table-wrap,
[data-reduce-transparency="1"] .tabs,
[data-reduce-transparency="1"] .pos-suggest,
[data-reduce-transparency="1"] .dropdown-menu,
[data-reduce-transparency="1"] .modal,
[data-reduce-transparency="1"] .toast,
[data-reduce-transparency="1"] .cart,
[data-reduce-transparency="1"] .pos-tile,
[data-reduce-transparency="1"] .login-card,
[data-reduce-transparency="1"] .emoji-grid,
[data-reduce-transparency="1"] .icon-btn,
[data-reduce-transparency="1"] .chip,
[data-reduce-transparency="1"] .btn-ghost,
[data-reduce-transparency="1"] input,
[data-reduce-transparency="1"] select,
[data-reduce-transparency="1"] textarea,
[data-reduce-transparency="1"] .modal-overlay{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
[data-reduce-transparency="1"]{--glass:#FFFFFF;--glass-strong:#FFFFFF}
body[data-reduce-transparency="1"]{background:#F2F3F7}
[data-reduce-transparency="1"] .sidebar{background:#1C1C20}
[data-reduce-transparency="1"] .modal-overlay{background:rgba(0,0,0,.45)}
[data-reduce-transparency="1"] input,
[data-reduce-transparency="1"] select,
[data-reduce-transparency="1"] textarea{background:#fff;border-color:#D2D2D7}
[data-theme="dark"][data-reduce-transparency="1"]{--glass:#1C1C20;--glass-strong:#232328}
body[data-theme="dark"][data-reduce-transparency="1"]{background:#0B0B0F}
[data-theme="dark"][data-reduce-transparency="1"] input,
[data-theme="dark"][data-reduce-transparency="1"] select,
[data-theme="dark"][data-reduce-transparency="1"] textarea{background:#2C2C31;border-color:#3A3A40}

/* Respect the OS setting too */
@media (prefers-reduced-transparency:reduce){
  .card,.stat,.table-wrap,.modal,.cart,.topbar,.sidebar,.pos-tile,.login-card{
    backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ═══════════════════════════════════════════════════════════════════════
   LAYOUT FIXES
   The POS used height:calc(100vh - 67px) with a hard-coded topbar height.
   The topbar grew (subtitle + save chip) and pushed the Charge button off a
   768px-tall till screen. Everything is flex-driven now, so nothing depends
   on a magic number.
   ═══════════════════════════════════════════════════════════════════════ */
.app-shell{height:100vh;overflow:hidden}
.main{height:100vh;min-height:0}
.topbar{flex-shrink:0}
.view{flex:1;min-height:0;overflow-y:auto}
.view-flush{padding:0;overflow:hidden}          /* POS manages its own scroll */
.pos-layout{height:100%;min-height:0}
.pos-left{min-height:0;padding:16px}
.cart{height:100%;min-height:0;margin:0}
.cart-items{min-height:0}
.cart-foot{flex-shrink:0}                        /* Charge is always reachable */

/* Category chips stay on one line and scroll sideways instead of eating
   three rows of vertical space. */
.pos-left .chip-row{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  padding-bottom:4px;scrollbar-width:none;flex-shrink:0}
.pos-left .chip-row::-webkit-scrollbar{display:none}
.pos-left .chip-row .chip{flex:0 0 auto}

@media (max-width:1280px){
  .pos-layout{grid-template-columns:1fr 370px}
  .sidebar{width:224px}
}
@media (max-width:1120px){
  .pos-layout{grid-template-columns:1fr 340px}
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}
}
@media (max-height:820px){
  .pos-search input{font-size:15px;padding:12px 52px 12px 44px}
  .pt-thumb{height:44px;margin-bottom:6px}
  .pt-name{height:32px;font-size:12px}
  .cart-total-row.grand{font-size:19px;margin:8px 0 2px;padding-top:8px}
  .cart-total-row.grand span:last-child{font-size:19px}
  .btn-lg{padding:13px 18px;font-size:15px}
  .cart-head{padding:12px 16px 10px}
  .cart-foot{padding:12px 16px}
}
@media (max-width:900px){
  .app-shell{height:auto;overflow:visible}
  .main{height:auto}
  .view{overflow:visible}
  .view-flush{overflow:visible}

   properties, clamp() and grid's `gap` shorthand. Everything below is a

<body data-theme="light">
<div id="root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<script>
"use strict";
/* ========================================================================
   KAKA POS — Standalone browser build. Data layer + app in one file.
   ======================================================================== */

/* ---------- Text normalization (accent/Arabic/typo-tolerant search) ------ */
var ARABIC_MAP={"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه"};
var ARABIC_DIAC=/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
function stripAccents(s){return s.normalize("NFKD").replace(/[̀-ͯ]/g,"");}
function normalize(s){if(!s)return"";s=(""+s).trim().toLowerCase();s=s.replace(ARABIC_DIAC,"");
  s=s.replace(/[؀-ۿ]/g,function(c){return ARABIC_MAP[c]||c;});s=stripAccents(s);
  return s.replace(/[^0-9a-z؀-ۿ]+/g,"");}
function searchBlob(){var out=[],seen={};for(var i=0;i<arguments.length;i++){var n=normalize(arguments[i]);
  if(n&&!seen[n]){seen[n]=1;out.push(n);}}return out.join(" ");}
function levenshtein(a,b){if(a===b)return 0;if(!a)return b.length;if(!b)return a.length;
  var prev=[];for(var j=0;j<=b.length;j++)prev[j]=j;
  for(var i=0;i<a.length;i++){var cur=[i+1];for(var k=0;k<b.length;k++){
    cur[k+1]=Math.min(prev[k+1]+1,cur[k]+1,prev[k]+(a[i]!==b[k]?1:0));}prev=cur;}return prev[b.length];}

/* ---------- Local data store (localStorage-backed) ---------------------- */
var STORE_KEY="kaka_pos_data_v1";
var CART_KEY="kaka_active_cart";     /* survives a crash mid-sale */

/* ---------- Crash safety -----------------------------------------------
   A till loses power, a browser is closed by mistake, a tab crashes. The
   basket is kept outside the page so the sale can be picked up again. */
/* True once this page has written a basket: a basket saved by the tab we are
   still in was merely navigated away from, not lost, so it comes back silently
   instead of asking. Only a basket left by an earlier page load is a crash. */
var CART_LIVE=false;
function saveActiveCart(state){
  try{
    if(!state||!state.cart||!state.cart.length){localStorage.removeItem(CART_KEY);return;}
    CART_LIVE=true;
    localStorage.setItem(CART_KEY,JSON.stringify({
      cart:state.cart,discount:state.discount,discount_pct:state.discount_pct,
      customer_id:state.customer_id,user:SESSION.user?SESSION.user.username:"",
      at:new Date().toISOString()}));
  }catch(e){/* a full cache must never block selling */}}
function loadActiveCart(){
  try{var raw=localStorage.getItem(CART_KEY);if(!raw)return null;
    var d=JSON.parse(raw);
    if(!d||!d.cart||!d.cart.length)return null;
    /* Ignore a basket left by a different cashier or from long ago. */
    if(d.user&&SESSION.user&&d.user!==SESSION.user.username)return null;
    if(d.at&&(Date.now()-new Date(d.at).getTime())>12*3600*1000)return null;
    return d;}catch(e){return null;}}
function clearActiveCart(){try{localStorage.removeItem(CART_KEY);}catch(e){}}

/* ---------- Automatic backup files -------------------------------------
   Browsers older than 2020 cannot write to a file the app chooses, so on
   those machines everything lives in browser storage — a few megabytes that
   a cleanup tool can wipe. To make that safe, the app hands the browser a
   dated backup file every so often. Firefox and Chrome drop it straight into
   the download folder, so the shop ends up with real files on the disk
   without anyone remembering to do anything. */
function downloadJSON(filename,data){
  try{
    var blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    var a=document.createElement("a");
    var url=URL.createObjectURL(blob);
    a.href=url;a.download=filename;a.style.display="none";
    document.body.appendChild(a);a.click();
    setTimeout(function(){a.parentNode&&a.parentNode.removeChild(a);
      try{URL.revokeObjectURL(url);}catch(e){}},400);
    return true;
  }catch(e){return false;}}
function stampName(prefix){
  var d=new Date();
  function two(n){return (n<10?"0":"")+n;}
  return prefix+"-"+d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate())+
    "-"+two(d.getHours())+two(d.getMinutes())+".json";}
/* How many sales between automatic backups; 0 turns it off. */
function autoBackupEvery(){
  var n=parseInt(DB.data.settings.auto_backup_every);
  if(isNaN(n))n=(FileStore.supported()?0:20);
  return Math.max(0,n);}
var salesSinceBackup=0;
function autoBackupTick(force){
  /* With a real data file connected there is nothing to protect against. */
  if(FileStore.handle&&!force)return false;
  var every=autoBackupEvery();
  if(!force&&(!every||++salesSinceBackup<every))return false;
  salesSinceBackup=0;
  var ok=downloadJSON(stampName("kaka-backup"),DB.data);
  if(ok){DB.data.settings.last_auto_backup=new Date().toISOString();
    try{localStorage.setItem(STORE_KEY,JSON.stringify(DB.data));}catch(e){}
    log("auto_backup","backup",""); }
  return ok;}
/* Shout once per session when browser storage starts filling up. */
var storageWarned=false;
function checkStorageRoom(){
  if(FileStore.handle||storageWarned)return;
  var pct=Math.round(DB.usage()/5242880*100);
  if(pct<75)return;
  storageWarned=true;
  toast("Browser storage is "+pct+"% full — export a backup and archive old sales (Users → Backup & Data)","error");}

/* Move sales older than `days` into a file the shop keeps, then drop them
   from storage. Reports stop covering that period, so it asks first and only
   removes anything once the file has actually been handed to the browser. */
function archiveOldSales(days,onDone){
  var cut=new Date();cut.setDate(cut.getDate()-days);
  var old=(DB.data.sales||[]).filter(function(s){return new Date(s.created_at)<cut;});
  if(!old.length){toast("No sales older than "+days+" days","success");return;}
  var total=old.reduce(function(a,s){return a+(s.total||0);},0);
  confirmModal("Archive "+old.length+" sale(s) older than "+days+" days, worth "+money(total)+
    "? They are saved to a file first, then removed from this computer. Reports will no longer include them.",
    function(){
      var ok=downloadJSON(stampName("kaka-sales-archive"),
        {archived_at:new Date().toISOString(),older_than_days:days,sales:old});
      if(!ok){toast("Could not save the archive file — nothing was removed","error");return;}
      var keep={};old.forEach(function(s){keep[s.id]=true;});
      DB.data.sales=DB.data.sales.filter(function(s){return !keep[s.id];});
      DB.save();log("archive_sales","sales",old.length+" sales older than "+days+" days");
      toast(old.length+" sale(s) archived to your downloads","success");
      if(onDone)onDone();});}

/* ---------- Rolling snapshots ------------------------------------------
   A daily copy of the whole dataset is kept in IndexedDB (far roomier than
   localStorage) so a bad import, a mistaken wipe or a corrupted file can be
   rolled back without hunting for a manual backup. */
var SNAP_KEEP=7;
function snapshotList(){return idbGet("snapshots").then(function(v){return v||[];}).catch(function(){return[];});}
function takeSnapshot(reason){
  var today_=today();
  return snapshotList().then(function(list){
    /* One automatic snapshot per day; manual ones always store. */
    if(reason==="daily"&&list.some(function(s){return s.day===today_;}))return false;
    var payload;
    try{payload=JSON.stringify(DB.data);}catch(e){return false;}
    list.unshift({id:"s"+Date.now(),day:today_,reason:reason||"daily",
      at:new Date().toISOString(),size:payload.length,data:payload});
    while(list.length>SNAP_KEEP)list.pop();
    return idbSet("snapshots",list).then(function(){return true;}).catch(function(){return false;});
  });}
function restoreSnapshot(id){
  return snapshotList().then(function(list){
    var s=list.filter(function(x){return x.id===id;})[0];
    if(!s)return false;
    var parsed=JSON.parse(s.data);
    if(!parsed||!parsed.products||!parsed.settings)return false;
    DB.data=parsed;DB.migrate();DB.save();return true;});}

/* ---------- Data health check ------------------------------------------
   Verifies the numbers agree with each other and offers to repair. */
function healthCheck(){
  var issues=[];
  var d=DB.data;
  d.products.forEach(function(p){
    var sum=0;
    d.movements.forEach(function(m){if(m.product_id===p.id)sum+=(m.change_qty||0);});
    if(Math.abs(sum-(p.quantity||0))>0.01)
      issues.push({type:"ledger",id:p.id,name:p.name_en||p.name_ar,
        detail:"stock "+num(p.quantity,2)+" but movements total "+num(sum,2),
        fix:function(){adjustStock(p.id,(p.quantity||0)-sum===0?0:0,"adjustment","");
          /* Trust the on-hand figure and add a balancing entry. */
          var diff=(p.quantity||0)-sum;
          if(diff!==0){d.movements.unshift({id:DB.nextId("movements"),product_id:p.id,
            product_name:p.name_en,change_qty:diff,balance:p.quantity,reason:"adjustment",
            note:"Ledger correction",loss_value:0,user:"system",created_at:new Date().toISOString()});}}});
    var bt=totalBatchQty(p);
    if(bt>0&&Math.abs(bt-(p.quantity||0))>0.01)
      issues.push({type:"batches",id:p.id,name:p.name_en||p.name_ar,
        detail:"batches hold "+num(bt,2)+" but stock is "+num(p.quantity,2),
        fix:function(){p.quantity=Math.round(bt*1000)/1000;}});
    if(p.quantity<0)
      issues.push({type:"negative",id:p.id,name:p.name_en||p.name_ar,
        detail:"negative stock ("+num(p.quantity,2)+")",
        fix:function(){p.quantity=0;}});
    if(p.selling_price<0||p.purchase_price<0)
      issues.push({type:"price",id:p.id,name:p.name_en||p.name_ar,detail:"negative price",
        fix:function(){p.selling_price=Math.max(0,p.selling_price);p.purchase_price=Math.max(0,p.purchase_price);}});
  });
  /* Duplicate barcodes make scanning ambiguous. */
  var seen={};
  d.products.forEach(function(p){
    [p.barcode,p.box_barcode].forEach(function(c){if(!c)return;
      if(seen[c])issues.push({type:"dupbarcode",id:p.id,name:p.name_en||p.name_ar,
        detail:"barcode "+c+" is also on "+seen[c],fix:null});
      else seen[c]=p.name_en||p.name_ar;});});
  return issues;}
var ROLE_PERMS={
  administrator:["*"],
  manager:["dashboard","pos","products.view","products.edit","inventory","suppliers","customers",
    "purchases","expenses","reports","register","zakat","settings","edit_price","refund","discount","history"],
  cashier:["dashboard","pos","products.view","customers","register","discount","refund","history"],
  inventory:["dashboard","products.view","products.edit","inventory","suppliers","purchases"]
};
var ROLE_LABELS={administrator:"Administrator",manager:"Manager",cashier:"Cashier",inventory:"Inventory Employee"};

function hashPw(s){/* demo-grade only — client-side hashing is not real security */
  var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return "h"+(h>>>0).toString(16);}

/* ---------- Data file on the PC ----------------------------------------
   The app can own a real file on disk (via the File System Access API) and
   rewrite it after every change, so the till's data lives next to the app
   instead of inside the browser. The chosen file is remembered in IndexedDB,
   so reopening the app reconnects to it. localStorage is still written as a
   mirror, so nothing is lost if the file is disconnected or unsupported. */
var IDB_NAME="kaka_pos_fs",IDB_STORE="handles";
function idbOpen(){return new Promise(function(res,rej){
  var r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=function(){r.result.createObjectStore(IDB_STORE);};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbSet(key,val){return idbOpen().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(val,key);
  tx.oncomplete=function(){res(true);};tx.onerror=function(){rej(tx.error);};});});}
function idbGet(key){return idbOpen().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction(IDB_STORE,"readonly");var rq=tx.objectStore(IDB_STORE).get(key);
  rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){rej(rq.error);};});});}
function idbDel(key){return idbOpen().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).delete(key);
  tx.oncomplete=function(){res(true);};tx.onerror=function(){rej(tx.error);};});});}

var FileStore={
  handle:null,
  name:"",
  status:"off",          /* off | connected | saving | saved | error | denied */
  lastSaved:null,
  lastError:"",
  _chain:Promise.resolve(),   /* serialises writes so they cannot interleave */
  _pending:null,
  supported:function(){
    return typeof window.showSaveFilePicker==="function"&&
           typeof window.showOpenFilePicker==="function"&&
           typeof indexedDB!=="undefined";},
  setStatus:function(st,err){this.status=st;this.lastError=err||"";
    if(st==="saved")this.lastSaved=new Date();
    if(typeof updateSaveChip==="function")updateSaveChip();},
  /* Reconnect to the remembered file, if permission is still granted. */
  restore:function(){var self=this;
    if(!this.supported())return Promise.resolve(false);
    return idbGet("dataFile").then(function(h){
      if(!h)return false;
      self.handle=h;self.name=h.name||"data file";
      if(!h.queryPermission)return false;
      return h.queryPermission({mode:"readwrite"}).then(function(p){
        if(p==="granted"){self.setStatus("connected");return true;}
        self.setStatus("denied");return false;});
    }).catch(function(){return false;});},
  /* Ask again for access — needs a user gesture, so call it from a click. */
  regrant:function(){var self=this;
    if(!this.handle||!this.handle.requestPermission)return Promise.resolve(false);
    return this.handle.requestPermission({mode:"readwrite"}).then(function(p){
      if(p==="granted"){self.setStatus("connected");return true;}
      self.setStatus("denied");return false;});},
  /* Remembering the handle is a convenience — if it fails (private mode, no
     IndexedDB) the file still works for this session, so never let it abort
     the connection. */
  remember:function(h){return idbSet("dataFile",h).catch(function(){
    try{toast("This file will be used now, but the app cannot remember it for next time.","error");}catch(e){}
    return false;});},
  create:function(suggested){var self=this;
    return window.showSaveFilePicker({
      suggestedName:suggested||("kaka-pos-data.json"),
      types:[{description:"KAKA POS data",accept:{"application/json":[".json"]}}]
    }).then(function(h){
      self.handle=h;self.name=h.name;self.setStatus("connected");
      return self.remember(h);
    }).then(function(){return DB.flush();}).then(function(){return true;});},
  openExisting:function(){var self=this;
    return window.showOpenFilePicker({multiple:false,
      types:[{description:"KAKA POS data",accept:{"application/json":[".json"]}}]
    }).then(function(list){
      var h=list[0];self.handle=h;self.name=h.name;
      return self.remember(h).then(function(){return self.read();});
    }).then(function(parsed){self.setStatus("connected");return parsed;});},
  read:function(){var self=this;
    if(!this.handle)return Promise.resolve(null);
    return this.handle.getFile().then(function(f){return f.text();}).then(function(txt){
      if(!txt||!txt.trim())return null;
      try{return JSON.parse(txt);}catch(e){
        self.setStatus("error","The data file is not valid JSON");return null;}});},
  /* Every write is queued behind the previous one. */
  write:function(data,immediate){var self=this;
    if(!this.handle)return Promise.resolve(false);
    var payload=JSON.stringify(data);
    this._chain=this._chain.then(function(){
      self.setStatus("saving");
      return self.handle.createWritable().then(function(w){
        return w.write(payload).then(function(){return w.close();});
      }).then(function(){self.setStatus("saved");return true;})
        .catch(function(e){
          var denied=e&&(e.name==="NotAllowedError"||e.name==="SecurityError");
          self.setStatus(denied?"denied":"error",(e&&e.message)||String(e));
          if(denied)try{toast("Lost write access to the data file — reconnect it in Backup & Data.","error");}catch(_){}
          return false;});
    });
    return this._chain;},
  disconnect:function(){this.handle=null;this.name="";this.setStatus("off");
    return idbDel("dataFile").catch(function(){});}
};

var DB={
  data:null,
  load:function(){try{this.data=JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){this.data=null;}
    if(!this.data){this.seed();}else{this.migrate();}return this.data;},
  /* Bring an existing browser's data up to the current shape. Runs on every
     load and only fills in what is missing, so it is safe to re-run. */
  migrate:function(){var d=this.data,changed=false;
    function def(o,k,v){if(o[k]===undefined){o[k]=v;changed=true;}}
    (d.products||[]).forEach(function(p){
      def(p,"units_per_box",0);def(p,"pack_name","Box");def(p,"box_barcode","");def(p,"box_price",0);
      def(p,"emoji","");def(p,"image","");def(p,"tiers",[]);def(p,"batches",[]);
    });
    (d.sales||[]).forEach(function(s){(s.items||[]).forEach(function(it){
      def(it,"pack_units",1);def(it,"pack_label","");});});
    (d.movements||[]).forEach(function(m){def(m,"loss_value",0);});
    def(d,"writeoffs",[]);def(d,"_held",[]);def(d,"purchase_returns",[]);def(d,"stocktakes",[]);
    def(d,"cash_moves",[]);
    (d.products||[]).forEach(function(p){def(p,"plu","");});
    var sd=d.settings||{};
    def(sd,"scale_enabled","1");def(sd,"scale_prefix","2");def(sd,"scale_plu_len",6);
    def(sd,"scale_value_len",5);def(sd,"scale_mode","price");
    def(sd,"scale_price_divisor",100);def(sd,"scale_weight_divisor",1000);
    def(sd,"loyalty_enabled","1");def(sd,"loyalty_earn_per",1);
    def(sd,"loyalty_point_value",0.01);def(sd,"loyalty_min_redeem",100);
    /* Anyone already using the app has effectively finished setup. */
    def(sd,"autolock_minutes",10);def(sd,"reduce_transparency","0");
    def(sd,"prices_include_tax","0");def(sd,"setup_done","1");
    /* Existing installs keep whatever they had; a rate of 0 means no tax. */
    def(sd,"tax_enabled",(parseFloat(sd.tax_rate)>0?"1":"0"));

        FileStore.supported()?el("div",{class:"flex",style:"flex-wrap:wrap"},[
          el("button",{class:"btn btn-primary",text:"➕ Create data file…",onClick:function(){
            FileStore.create((answers.store||"kaka-pos")+"-data.json").then(function(){
              toast("Saving to "+FileStore.name,"success");drawStatus();
            }).catch(function(e){if(e&&e.name!=="AbortError")toast("Could not create the file","error");});}}),
          el("button",{class:"btn btn-ghost",text:"📂 Open existing…",onClick:function(){
            FileStore.openExisting().then(function(parsed){
              if(parsed&&parsed.products){DB.data=parsed;DB.migrate();DB.save();
                toast("Loaded existing data","success");m.close();if(onDone)onDone(true);}
              else{DB.flush();drawStatus();}
            }).catch(function(e){if(e&&e.name!=="AbortError")toast("Could not open the file","error");});}})]):null]));}
    else if(step===3){
      titleEl.textContent="Secure the administrator account";
      refs.pw1=el("input",{type:"password",placeholder:"At least 6 characters"});
      refs.pw2=el("input",{type:"password",placeholder:"Repeat it"});
      body.appendChild(el("div",{},[
        el("div",{class:"banner banner-warn mb",
          html:"The <strong>admin</strong> account still uses the default password. Anyone who knows it could open your books — please change it now."}),
        el("div",{class:"form-grid"},[
          el("div",{class:"field full"},[el("label",{text:"New admin password *"}),refs.pw1]),
          el("div",{class:"field full"},[el("label",{text:"Confirm password *"}),refs.pw2])]),
        el("p",{class:"hint mt",text:"Write it down somewhere safe — there is no email recovery in an offline app."})]));
      setTimeout(function(){refs.pw1.focus();},60);}
    else{
      titleEl.textContent="Start with your own products?";
      function card(clean,icon,title,desc){
        return el("div",{class:"choice"+(answers.clean===clean?" active":""),onClick:function(){answers.clean=clean;draw();}},[
          el("div",{style:"font-size:26px",text:icon}),
          el("div",{},[el("div",{style:"font-weight:650",text:title}),el("div",{class:"hint",text:desc})])]);}
      body.appendChild(el("div",{},[
        el("p",{class:"hint mb",text:"The app currently contains example products so you can try it out."}),
        card(true,"🧹","Clear the examples","Start with an empty shop. Add your products by scanning them, or import a CSV."),
        card(false,"📦","Keep the examples","Handy for training staff. You can delete them later from Products.")]));}
  }
  function validate(){
    if(step===1){
      var v=(refs.store.value||"").trim();
      if(!v){toast("Please enter your shop name","error");refs.store.focus();return false;}
      answers.store=v;answers.currency=(refs.currency.value||"MAD").trim()||"MAD";
      answers.taxOn=refs.taxOn.value==="1";
      answers.tax=answers.taxOn?(parseFloat(refs.tax.value)||0):0;
      answers.phone=refs.phone.value;answers.address=refs.address.value;
      if(answers.tax<0){toast("Tax cannot be negative","error");return false;}
      return true;}
    if(step===3){
      var a=refs.pw1.value,b2=refs.pw2.value;
      if(a.length<6){toast("Password must be at least 6 characters","error");return false;}
      if(a!==b2){toast("The two passwords do not match","error");return false;}
      answers.pw1=a;return true;}
    return true;}
  function finish(){
    var st=DB.data.settings;
    st.store_name=answers.store;st.currency=answers.currency;
    st.tax_enabled=answers.taxOn?"1":"0";st.tax_rate=answers.tax;
    st.store_phone=answers.phone||"";st.store_address=answers.address||"";
    st.language=answers.lang;st.setup_done="1";
    var admin=DB.data.users.filter(function(u){return u.username==="admin";})[0];
    if(admin&&answers.pw1)admin.password=hashPw(answers.pw1);
    if(answers.clean)wipeBusinessData();
    DB.save();log("setup_complete","settings",answers.store);
    m.close();
    toast("All set — "+answers.store+" is ready","success");
    if(onDone)onDone(true);}
  draw();}

/* Flexbox spacing via `gap` landed long after the last browser that runs on
   Windows XP. Measure it instead of sniffing the browser, and let the CSS
   fall back to margins when it is missing. */
var LEGACY_GAP=null,COLOR_MIX=null;
function flexGapSupported(){
  if(LEGACY_GAP!==null)return LEGACY_GAP;
  try{
    var f=document.createElement("div");
    f.style.cssText="display:flex;gap:8px;position:absolute;visibility:hidden;top:-999px";
    var a=document.createElement("div"),b=document.createElement("div");
    a.style.cssText=b.style.cssText="width:1px;height:1px";
    f.appendChild(a);f.appendChild(b);
    document.body.appendChild(f);
    LEGACY_GAP=f.scrollWidth>5;
    f.parentNode.removeChild(f);
  }catch(e){LEGACY_GAP=true;}
  return LEGACY_GAP;}
/* color-mix() only reached Chrome in 2023, so the last Chrome for Windows 7
   drops every declaration that uses it — including the buttons' colours. */
function colorMixSupported(){
  if(COLOR_MIX!==null)return COLOR_MIX;
  try{COLOR_MIX=!!(window.CSS&&CSS.supports&&CSS.supports("color","color-mix(in srgb,#000 50%,#fff)"));}
  catch(e){COLOR_MIX=false;}
  return COLOR_MIX;}
function applyLegacyLayout(){
  if(!flexGapSupported())document.body.className+=" legacy-gap";
  if(!colorMixSupported())document.body.className+=" no-color-mix";}

/* ---- French throughout ---------------------------------------------------
   Only the menus and the till were ever translated; everything else was
   written in English in the markup. Rather than thread a key through several
   hundred call sites, the translation happens where every piece of text
   already passes on its way to the screen: el(), setText() and toast().
   Exact phrases first, then messages that wrap a value (a receipt number, an
   amount), then a phrase that only begins a longer string. Anything unknown
   — product names, notes, numbers — is returned untouched. */
var FR_CACHE={},FR_PREFIX=null;
function frPrefixes(){
  if(FR_PREFIX)return FR_PREFIX;
  FR_PREFIX=[];
  for(var k in FR_TEXT)if(/[ :·(—]$/.test(k))FR_PREFIX.push(k);
  FR_PREFIX.sort(function(a,b){return b.length-a.length;});
  return FR_PREFIX;}
function trUI(v){
  if(SESSION.lang!=="fr"||v==null)return v;
  var s=String(v);
  if(!s||!/[A-Za-z]/.test(s))return v;
  if(FR_CACHE[s]!==undefined)return FR_CACHE[s];
  var out=null;
  if(FR_TEXT[s]!==undefined)out=FR_TEXT[s];
  if(out===null){
    var t=s.replace(/^\s+|\s+$/g,"");
    if(t!==s&&FR_TEXT[t]!==undefined)out=s.replace(t,FR_TEXT[t]);}
  if(out===null){
    for(var i=0;i<FR_PATTERNS.length;i++){
      if(FR_PATTERNS[i][0].test(s)){out=s.replace(FR_PATTERNS[i][0],FR_PATTERNS[i][1]);break;}}}
  if(out===null){
    var pre=frPrefixes();
    for(var j=0;j<pre.length;j++){
      if(s.length>pre[j].length&&s.slice(0,pre[j].length)===pre[j]){
        out=FR_TEXT[pre[j]]+s.slice(pre[j].length);break;}}}
  if(out===null)out=s;
  FR_CACHE[s]=out;
  return out;}
/* Printed documents are built as HTML strings, so translate the labels
   sitting between tags rather than the whole document. */
function trPrint(html){
  if(SESSION.lang!=="fr")return html;
  return String(html).replace(/>([^<>]{2,60})</g,function(m,inner){
    var fixed=trUI(inner);
    return fixed===inner?m:(">"+fixed+"<");});}

/* ---- Plain-text mode for machines with no emoji font --------------------
   Windows XP and other pre-2012 systems ship no emoji font at all, so every
   icon in this app would render as an empty box. Detect that once and fall
   back to words, which read better on an old low-resolution till anyway.
   The owner can force either mode from Settings if the guess is wrong. */
var EMOJI_OK=true;
function detectEmojiSupport(){
  var pref=String((DB.data&&DB.data.settings&&DB.data.settings.icon_mode)||"auto");
  if(pref==="text")return false;
  if(pref==="emoji")return true;
  try{
    var c=document.createElement("canvas");c.width=c.height=18;
    var x=c.getContext("2d");if(!x)return true;
    x.textBaseline="top";x.font="16px sans-serif";
    /* Test a recent emoji (the receipt, Unicode 11) against a character that
       is missing everywhere. Windows 7 draws older symbols but not newer
       ones, and a half-drawn icon set looks worse than none, so anything
       short of a complete modern emoji font falls back to words. */
    x.fillText("\uD83E\uDDFE",0,0);var withEmoji=c.toDataURL();
    x.clearRect(0,0,18,18);x.fillText("\uFFFF",0,0);
    return withEmoji!==c.toDataURL();
  }catch(e){return true;}}
/* Symbols that carry meaning alone get a plain stand-in; the rest already sit
   beside a word, so they simply disappear. Arrows, geometric shapes and box
   drawing are left alone — Arial and Tahoma have had those since the 1990s. */

    else if(k==="text"){v=trUI(v);n.textContent=EMOJI_OK?v:plainText(v);}
    else if(k==="placeholder"||k==="title")n.setAttribute(k,trUI(v));
    else if(k.slice(0,2)==="on"&&typeof v==="function")n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v===true)n.setAttribute(k,"");else n.setAttribute(k,v);}

  if(!EMOJI_OK&&attrs&&attrs.title&&!n.textContent&&(attrs.html||attrs.text))

function buildForm(fields,initial){initial=initial||{};var grid=el("div",{class:"form-grid"});var inputs={};
  fields.forEach(function(f){if(f.hidden)return;var wrap=el("div",{class:"field"+(f.full?" full":"")});
    wrap.appendChild(el("label",{text:f.label}));var input;
    if(f.type==="select"){input=el("select");(f.options||[]).forEach(function(o){
        input.appendChild(el("option",{value:o.value},o.label));});
      input.value=initial[f.name]!=null?initial[f.name]:(f.default||"");}
    else if(f.type==="textarea"){input=el("textarea",{rows:f.rows||2});input.value=initial[f.name]||"";}
    else{input=el("input",{type:f.type||"text"});input.value=initial[f.name]!=null?initial[f.name]:(f.default||"");
      if(f.step)input.step=f.step;if(f.placeholder)input.placeholder=f.placeholder;}

function pager(d,go){
  if(!d.pages||d.pages<=1)return el("div");
  var wrap=el("div",{class:"flex mt",style:"justify-content:center"});
  wrap.appendChild(el("button",{class:"btn btn-sm btn-ghost",text:"‹",

  wrap.appendChild(el("span",{style:"padding:0 12px",class:"hint",text:d.page+" / "+d.pages}));
