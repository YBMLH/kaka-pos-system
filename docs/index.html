function adjustStock(productId,change,reason,note,lossValue){
  var p=DB.data.products.filter(function(x){return x.id===productId;})[0];if(!p)return null;
  p.quantity=Math.round(((p.quantity||0)+change)*1000)/1000;
  DB.data.movements.unshift({id:DB.nextId("movements"),product_id:productId,product_name:p.name_en,
    change_qty:change,balance:p.quantity,reason:reason,note:note||"",loss_value:lossValue||0,
    user:SESSION.user?SESSION.user.username:"",created_at:new Date().toISOString()});
  return p.quantity;}

/* ---------- Case / box packaging ---------------------------------------
   Stock is always held in base units (pieces). A product may additionally be
   bought and sold as a case: `units_per_box` pieces per case, an optional
   separate `box_barcode` printed on the outer carton, and an optional
   `box_price`. When no box price is set we fall back to units x unit price. */
function hasBox(p){return (p.units_per_box||0)>1;}
function packName(p){return p.pack_name||"Box";}
function boxPrice(p){return (p.box_price>0)?p.box_price:(p.units_per_box||0)*(p.selling_price||0);}
function boxCost(p){return (p.units_per_box||0)*(p.purchase_price||0);}
/* Per-piece price when buying a whole case — shows the customer's saving. */
function boxUnitPrice(p){var u=p.units_per_box||0;return u?boxPrice(p)/u:0;}
function boxSavingPct(p){var sp=p.selling_price||0;if(!hasBox(p)||!sp)return 0;
  return Math.round((1-boxUnitPrice(p)/sp)*1000)/10;}
/* "3 Box + 12 pcs" — how a shopkeeper actually counts the shelf. */
function packPlural(p,n){
  var name=trUI(packName(p));
  if(n<=1)return name;
  /* English adds -es to Box, French simply adds -s. */
  return SESSION.lang==="fr"?(name+(/s$/i.test(name)?"":"s")):(name+"es");}
function fmtStock(p){var q=p.quantity||0;var u=p.units_per_box||0;
  if(u>1){var b=Math.floor(q/u),r=Math.round((q-b*u)*100)/100;
    return (b?b+" "+packPlural(p,b):"")+(b&&r?" + ":"")+(r||!b?num(r,r%1?2:0)+" "+p.unit:"");}
  return num(q,q%1?2:0)+" "+p.unit;}
function stockTitle(p){return hasBox(p)?(num(p.quantity,2)+" "+p.unit+
  (SESSION.lang==="fr"?" au total · ":" total · ")+p.units_per_box+" "+p.unit+
  (SESSION.lang==="fr"?" par ":" per ")+trUI(packName(p))):"";}

/* ---------- Wholesale price tiers --------------------------------------
   tiers = [{min_qty, price}] priced per piece. The best (lowest) qualifying
   price wins, so "10+ at 8.00, 50+ at 7.00" behaves as expected. */
function tierPrice(p,qty){
  var best=null;(p.tiers||[]).forEach(function(t){
    if(qty>=(t.min_qty||0)&&t.price>0&&(best===null||t.price<best))best=t.price;});
  return best;}
function effectiveUnitPrice(p,qty){var t=tierPrice(p,qty);
  return (t!==null&&t<p.selling_price)?t:p.selling_price;}

/* ---------- Batches & expiry (FEFO) ------------------------------------
   Batches are an optional detail layer: product.quantity stays the single
   total, while batches record where that stock came from and when it expires.
   Stock is consumed First-Expired-First-Out. */
function totalBatchQty(p){var n=0;(p.batches||[]).forEach(function(b){n+=b.qty||0;});return n;}
function addBatch(p,qty,expiry,batchNo,cost){
  if(!qty)return;p.batches=p.batches||[];
  p.batches.push({id:"b"+Date.now()+Math.floor(Math.random()*1000),qty:qty,
    expiry:expiry||"",batch_no:batchNo||"",cost:cost||p.purchase_price||0,
    received_at:new Date().toISOString()});}
/* Consume `qty` pieces FEFO. Batches with an expiry go first (soonest first),
   then undated stock. Returns the batches touched, for the audit note. */
function consumeBatches(p,qty){
  if(!p.batches||!p.batches.length)return[];
  var order=p.batches.slice().sort(function(a,b){
    if(a.expiry&&b.expiry)return a.expiry<b.expiry?-1:1;
    if(a.expiry)return -1;if(b.expiry)return 1;
    return (a.received_at||"")<(b.received_at||"")?-1:1;});
  var used=[],left=qty;
  for(var i=0;i<order.length&&left>0;i++){var b=order[i];if(b.qty<=0)continue;
    var take=Math.min(b.qty,left);b.qty=Math.round((b.qty-take)*1000)/1000;left-=take;
    used.push({batch_no:b.batch_no,expiry:b.expiry,qty:take});}
  p.batches=p.batches.filter(function(b){return b.qty>0.0001;});
  return used;}
function daysUntil(dateStr){if(!dateStr)return null;
  var d=new Date(dateStr+"T00:00:00"),now=new Date();now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);}
/* Earliest expiry still in stock — drives the product-list warning. */
function nextExpiry(p){var best=null;(p.batches||[]).forEach(function(b){
    if(b.expiry&&b.qty>0&&(best===null||b.expiry<best))best=b.expiry;});
  if(best===null&&p.expiry_date)best=p.expiry_date;return best;}
function expiryState(p){var e=nextExpiry(p);if(!e)return null;
  var d=daysUntil(e);if(d===null)return null;
  return{date:e,days:d,status:d<0?"expired":(d<=7?"critical":(d<=30?"soon":"ok"))};}
/* Pieces already expired — what a write-off would remove. */
function expiredQty(p){
  var tracked=(p.batches||[]).filter(function(b){return b.qty>0;});
  if(tracked.length){var n=0;tracked.forEach(function(b){
    if(b.expiry&&daysUntil(b.expiry)<0)n+=b.qty;});return n;}
  /* No batches: fall back to the product's single expiry date. */
  if(p.expiry_date&&daysUntil(p.expiry_date)<0)return p.quantity||0;
  return 0;}
/* Stock not covered by any batch — shown so expiry data can be trusted. */
function untrackedQty(p){
  var t=totalBatchQty(p);if(!t)return 0;
  return Math.round(((p.quantity||0)-t)*1000)/1000;}

/* ---------- Stock loss / write-off -------------------------------------
   Damage, loss, expiry and theft remove stock AND book a monetary loss at
   cost price, which flows into the financial reports and net profit. */
var LOSS_REASONS={damage:"Damaged",expired:"Expired",loss:"Lost / stolen",breakage:"Breakage",sample:"Sample / staff use"};
function writeOff(product,qty,reason,note){
  qty=Math.abs(parseFloat(qty)||0);if(!qty)return null;
  var cost=product.purchase_price||0;var value=Math.round(qty*cost*100)/100;
  var used=consumeBatches(product,qty);
  var detail=used.length?used.map(function(u){return u.qty+(u.expiry?("@"+u.expiry):"");}).join(", "):"";
  adjustStock(product.id,-qty,reason,(note||LOSS_REASONS[reason]||reason)+(detail?(" ["+detail+"]"):""),value);
  DB.data.writeoffs=DB.data.writeoffs||[];
  DB.data.writeoffs.unshift({id:DB.nextId("writeoffs"),product_id:product.id,
    product_name:product.name_en||product.name_ar,qty:qty,reason:reason,
    cost_price:cost,loss_value:value,note:note||"",
    user:SESSION.user?SESSION.user.username:"",created_at:new Date().toISOString()});
  log("write_off","product",(LOSS_REASONS[reason]||reason)+" "+qty+" × "+(product.name_en||"")+" = "+value);
  return value;}
/* Total value written off in a period (used by reports + dashboard). */
function shrinkageTotal(filterFn){var t=0;(DB.data.writeoffs||[]).forEach(function(w){
    if(filterFn&&!filterFn(w))return;t+=w.loss_value||0;});return Math.round(t*100)/100;}

/* ---------- Product search --------------------------------------------- */
/* Resolve any scanned code: piece barcode, case barcode, or SKU. */
/* ---- Scanners and keyboard layouts -------------------------------------
   A barcode scanner is a keyboard that types very fast, and it types as if
   the computer were set to a US layout. On a French (AZERTY) or Arabic
   keyboard the digit row lands somewhere else entirely, so scanning
   6111234567890 arrives as "\u00e8___\u00e0\u00e9..." — the right code, the wrong
   characters. Translate it back before anything tries to read it.
   The translation only runs when the whole thing looks like a scanned code,
   so a search for "Coca-Cola" or "L'Or\u00e9al" is never touched. */
var LAYOUT_DIGITS={
  /* French / Belgian AZERTY digit row, unshifted */
  "&":"1","\u00e9":"2","\"":"3","'":"4","(":"5","-":"6","\u00e8":"7","_":"8","\u00e7":"9","\u00e0":"0",
  /* Variants seen on Belgian and Swiss boards */
  "\u00a7":"6","!":"8","\u00b0":"0","\u00a3":"3",
  /* Arabic-Indic and Persian digits, in case the scanner emits them */
  "\u0660":"0","\u0661":"1","\u0662":"2","\u0663":"3","\u0664":"4",
  "\u0665":"5","\u0666":"6","\u0667":"7","\u0668":"8","\u0669":"9",
  "\u06f0":"0","\u06f1":"1","\u06f2":"2","\u06f3":"3","\u06f4":"4",
  "\u06f5":"5","\u06f6":"6","\u06f7":"7","\u06f8":"8","\u06f9":"9"};
function isScanChar(c){return (c>="0"&&c<="9")||LAYOUT_DIGITS[c]!==undefined;}
/* True when every character could have come from a scanner reading digits. */
function looksScanned(v){
  v=(v||"").trim();
  if(v.length<6||v.length>18)return false;
  for(var i=0;i<v.length;i++)if(!isScanChar(v.charAt(i)))return false;
  return true;}
function scanDigits(v){
  v=(v||"").trim();
  if(!looksScanned(v))return v;
  var out="";
  for(var i=0;i<v.length;i++){var c=v.charAt(i);
    out+=(c>="0"&&c<="9")?c:LAYOUT_DIGITS[c];}
  return out;}

function lookupBarcode(code){
  var p=DB.data.products.filter(function(x){return!x.archived&&x.barcode===code;})[0];
  if(p)return{product:p,isBox:false};
  p=DB.data.products.filter(function(x){return!x.archived&&x.box_barcode&&x.box_barcode===code;})[0];
  if(p)return{product:p,isBox:true};
  return null;}
/* What was typed always wins: a code that really does contain a dash still
   matches itself, and only a code that matches nothing is retried as a
   mistyped scan. */
function findByBarcode(code){
  code=(code||"").trim();if(!code)return null;
  var hit=lookupBarcode(code);
  if(hit)return hit;
  var fixed=scanDigits(code);
  return fixed!==code?lookupBarcode(fixed):null;}
function searchProducts(term,limit){limit=limit||15;term=(term||"").trim();if(!term)return{products:[]};
  var hit=findByBarcode(term);
  if(hit)return{products:[hit.product],exact_barcode:true,isBox:hit.isBox};
  var norm=normalize(term);
  var rows=DB.data.products.filter(function(p){if(p.archived)return false;
    return(p.search_blob||"").indexOf(norm)>-1||(p.sku||"").toLowerCase().indexOf(term.toLowerCase())>-1||
      (p.barcode||"").indexOf(term)>-1||(p.box_barcode||"").indexOf(term)>-1;});
  rows.sort(function(a,b){function sc(r){var blob=r.search_blob||"";if(blob.indexOf(norm)===0)return 0;
    var best=99;blob.split(" ").forEach(function(tok){best=Math.min(best,levenshtein(norm,tok));});return 1+best/100;}
    return sc(a)-sc(b);});
  return{products:rows.slice(0,limit)};}
function serializeProduct(p){var d={};for(var k in p)d[k]=p[k];var sp=p.selling_price||0,pp=p.purchase_price||0;
  d.profit_margin=sp?Math.round((sp-pp)/sp*10000)/100:0;d.profit_unit=Math.round((sp-pp)*100)/100;
  d.low_stock=(p.quantity||0)<=(p.min_stock||0);
  var c=DB.data.categories.filter(function(x){return x.id===p.category_id;})[0];d.category_name=c?c.name:"";
  return d;}

/* ---------- Date/period analytics -------------------------------------- */
function completedSales(){return DB.data.sales.filter(function(s){return s.status==="completed"||s.status==="partial_refund";});}
/* Recompute a sale's money from what the customer actually kept. Called after
   any refund so revenue, tax, cost and profit stop counting returned goods.
   The original figures are preserved once, so repeated refunds stay accurate. */
function recalcSaleTotals(sale){
  if(sale.orig_total===undefined){
    sale.orig_subtotal=sale.subtotal;sale.orig_total=sale.total;
    sale.orig_tax=sale.tax;sale.orig_cost=sale.cost_total;
    sale.orig_profit=sale.profit;sale.orig_discount=sale.discount;}
  var incl=!!sale.tax_inclusive;
  var fullSub=0,newSub=0,newTax=0,newCost=0;
  (sale.items||[]).forEach(function(it){
    var q=it.quantity||0,ref=it.refunded_qty||0,eff=Math.max(q-ref,0);
    var ratio=q?eff/q:0;
    var lineDisc=(it.discount||0);
    fullSub+=it.unit_price*q-lineDisc;
    var gross=it.unit_price*eff-lineDisc*ratio;
    var r=(it.tax_rate||0)/100;
    newSub+=gross;
    newTax+=incl?(gross-gross/(1+r)):(gross*r);
    newCost+=(it.purchase_price||0)*eff;});
  /* Scale the order-level discount to the part of the basket that was kept. */
  var share=fullSub>0?(newSub/fullSub):0;
  var disc=(sale.orig_discount||0)*share;
  sale.subtotal=round2(newSub);
  sale.discount=round2(disc);
  sale.tax=round2(newTax);
  sale.total=round2(incl?(newSub-disc):(newSub-disc+newTax));
  sale.cost_total=round2(newCost);
  sale.profit=round2((incl?(newSub-disc-newTax):(newSub-disc))-newCost);
  sale.refunded_total=round2((sale.orig_total||0)-sale.total);
  return sale;}
/* Voided sales are excluded from every revenue figure by the filter above. */
function inPeriod(iso,period){var d=new Date(iso);var now=new Date();
  var dd=dnorm(iso);var td=today();
  if(period==="today")return dd===td;
  if(period==="yesterday"){var y=new Date();y.setDate(y.getDate()-1);return dd===y.toISOString().slice(0,10);}
  if(period==="week"){var monday=new Date();var day=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-day);
    monday.setHours(0,0,0,0);return d>=monday;}
  if(period==="month")return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(period==="quarter")return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/3)===Math.floor(now.getMonth()/3);
  if(period==="half")return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/6)===Math.floor(now.getMonth()/6);
  if(period==="year")return d.getFullYear()===now.getFullYear();
  return true;}
function salesMetrics(filterFn){var m={orders:0,revenue:0,cost:0,gross_profit:0,tax:0,discount:0};
  completedSales().forEach(function(s){if(filterFn&&!filterFn(s))return;m.orders++;m.revenue+=s.total;
    m.cost+=s.cost_total;m.gross_profit+=s.profit;m.tax+=s.tax;m.discount+=s.discount;});
  ["revenue","cost","gross_profit","tax","discount"].forEach(function(k){m[k]=Math.round(m[k]*100)/100;});return m;}
function expenseTotal(filterFn){var t=0;DB.data.expenses.forEach(function(e){if(filterFn&&!filterFn(e))return;t+=e.amount;});return Math.round(t*100)/100;}
function inventoryValue(){var cost=0,retail=0,units=0,count=0;
  DB.data.products.forEach(function(p){if(p.archived)return;count++;units+=p.quantity;
    cost+=p.quantity*p.purchase_price;retail+=p.quantity*p.selling_price;});
  return{cost_value:Math.round(cost*100)/100,retail_value:Math.round(retail*100)/100,total_units:units,products:count};}

/* ---- CSV parsing & product import -------------------------------------
   Handles quoted fields, embedded commas/newlines and a UTF-8 BOM, so files
   exported straight out of Excel load without cleaning. */
function parseCSV(text){
  text=(text||"").replace(/^﻿/,"");
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"')q=true;
    else if(c===","||c===";"){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);cur="";rows.push(row);row=[];}
    else if(c!=="\r")cur+=c;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!=="";});});}

/* Tax is entirely optional — many markets (Algeria, for one) do not charge it
   at the till at all. When it is off, no tax is ever calculated, shown or

function taxEnabled(){return String(DB.data.settings.tax_enabled||"0")==="1";}

/* ---- Loyalty ----------------------------------------------------------
   Customers earn points per unit of currency spent and can spend them back as
   a discount. Point value and the minimum redemption are configurable. */
function loyaltyConfig(){var st=DB.data.settings;
  return{enabled:String(st.loyalty_enabled)==="1",
    earnPer:parseFloat(st.loyalty_earn_per)||1,
    pointValue:parseFloat(st.loyalty_point_value)||0.01,
    minRedeem:parseInt(st.loyalty_min_redeem)||0};}
function pointsEarned(total){var c=loyaltyConfig();
  return c.enabled?Math.floor((total||0)*c.earnPer):0;}
function pointsToMoney(points){return round2((points||0)*loyaltyConfig().pointValue);}
function moneyToPoints(amount){var v=loyaltyConfig().pointValue;
  return v>0?Math.ceil((amount||0)/v):0;}
/* Most points a customer may spend on this basket. */
function maxRedeemablePoints(customer,orderTotal){
  var c=loyaltyConfig();
  if(!c.enabled||!customer||!customer.loyalty_pts)return 0;
  if(customer.loyalty_pts<c.minRedeem)return 0;
  return Math.min(customer.loyalty_pts,moneyToPoints(orderTotal));}

/* ---- Camera barcode scanning ------------------------------------------
   Uses the browser's native BarcodeDetector, so it works offline with no
   external library. Unsupported browsers get a clear message instead. */
function cameraScanSupported(){return typeof window.BarcodeDetector!=="undefined"&&
  !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);}
function cameraScanModal(onCode){
  if(!cameraScanSupported()){
    modal("📷 Camera scanning",el("div",{},[
      el("div",{class:"banner banner-warn",text:"This browser cannot scan with the camera."}),
      el("div",{class:"hint",text:"Camera scanning needs the built-in BarcodeDetector, available in Chrome, Edge and Android browsers. "+
        "On other browsers use a USB/Bluetooth scanner or type the barcode."})]));
    return;}
  var video=el("video",{autoplay:true,playsinline:true,muted:true,
    style:"width:100%;border-radius:var(--radius-sm);background:#000;max-height:60vh"});
  var status=el("div",{class:"hint mt",style:"text-align:center",text:"Point the camera at a barcode…"});
  var stream=null,stop=false,detector=null;
  var m=modal("📷 Scan with camera",el("div",{},[video,status]),
    [{label:t("common.close"),class:"btn-ghost",onClick:function(){cleanup();}}],{sticky:false});
  /* Make sure the camera is released however the dialog is dismissed. */
  var origClose=m.close;
  m.close=function(){cleanup();origClose();};
  m.overlay.addEventListener("click",function(e){if(e.target===m.overlay)cleanup();});
  function cleanup(){stop=true;
    if(stream){stream.getTracks().forEach(function(tr){try{tr.stop();}catch(e){}});stream=null;}}
  try{detector=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code","itf"]});}
  catch(e){detector=new window.BarcodeDetector();}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(st){
    stream=st;video.srcObject=st;tick();}).catch(function(err){
    status.textContent="Could not open the camera: "+(err&&err.message||err);});
  function tick(){
    if(stop)return;
    if(video.readyState<2){requestAnimationFrame(tick);return;}
    detector.detect(video).then(function(codes){
      if(stop)return;
      if(codes&&codes.length){
        var value=codes[0].rawValue;
        if(value){status.textContent="Found "+value;
          cleanup();origClose();onCode(value);return;}}
      setTimeout(tick,180);
    }).catch(function(){setTimeout(tick,300);});}
}

/* ---- Scale / weighed-item barcodes ------------------------------------
   Deli, butcher and produce scales print an in-store EAN-13 that embeds
   either the price or the weight of the piece being sold:

       P P   I I I I I   V V V V V   C
       prefix  item/PLU    value    check

   The prefix (20-29 by convention) marks it as in-store. We look the product
   up by its PLU and turn the embedded value into a quantity:
     price mode  -> quantity = embedded price / price per kg
     weight mode -> quantity = embedded weight (grams -> kg)              */
function scaleConfig(){var st=DB.data.settings;
  return{enabled:String(st.scale_enabled)==="1",
    prefix:String(st.scale_prefix||"2"),
    pluLen:parseInt(st.scale_plu_len)||6,
    valLen:parseInt(st.scale_value_len)||5,
    mode:st.scale_mode||"price",
    priceDiv:parseFloat(st.scale_price_divisor)||100,
    weightDiv:parseFloat(st.scale_weight_divisor)||1000};}
/* Returns {plu, value, mode} for an in-store scale code, else null. */
function parseScaleBarcode(code){
  var cfg=scaleConfig();if(!cfg.enabled)return null;
  code=(code||"").trim();
  if(!/^[0-9]+$/.test(code))return null;
  var need=cfg.prefix.length+cfg.pluLen+cfg.valLen+1;
  if(code.length!==need)return null;
  if(code.indexOf(cfg.prefix)!==0)return null;
  var plu=code.substr(cfg.prefix.length,cfg.pluLen);
  var raw=code.substr(cfg.prefix.length+cfg.pluLen,cfg.valLen);
  if(!/^[0-9]+$/.test(plu)||!/^[0-9]+$/.test(raw))return null;
  return{plu:plu,raw:parseInt(raw,10),mode:cfg.mode,cfg:cfg};}
function findByPlu(plu){
  if(!plu)return null;
  var n=String(parseInt(plu,10));
  return DB.data.products.filter(function(p){
    if(p.archived||!p.plu)return false;
    return p.plu===plu||String(parseInt(p.plu,10))===n;})[0]||null;}
/* Resolve a scale label into {product, quantity, embeddedPrice}. */
function resolveScaleBarcode(code){
  var parsed=parseScaleBarcode(code);if(!parsed)return null;
  var p=findByPlu(parsed.plu);if(!p)return{unknownPlu:parsed.plu};
  if(parsed.mode==="weight"){
    var qty=parsed.raw/parsed.cfg.weightDiv;
    return{product:p,quantity:Math.round(qty*1000)/1000,embedded:"weight"};}
  var price=parsed.raw/parsed.cfg.priceDiv;
  var unit=p.selling_price||0;
  var q=unit>0?(price/unit):0;
  return{product:p,quantity:Math.round(q*1000)/1000,embeddedPrice:Math.round(price*100)/100,embedded:"price"};}

  /* ---- Stocktake with variance -----------------------------------------
     Count the shelf, compare against the system, and see the shortage or
     overage valued at cost before committing anything. Shortages can be
     booked as a stock loss so they land in the P&L. */
  function count(){
    var counts={},prods=DB.data.products.filter(function(p){return!p.archived;});
    var filterInp=el("input",{placeholder:"Filter products..."});
    var onlyCounted=el("input",{type:"checkbox"});
    var bookLoss=el("input",{type:"checkbox"});bookLoss.checked=true;
    var summary=el("div",{class:"grid stats-grid mb"});
    var tableBox=el("div",{});
    function variance(p){var c=counts[p.id];if(c===undefined)return null;
      var diff=Math.round((c-p.quantity)*1000)/1000;
      return{diff:diff,value:Math.round(diff*(p.purchase_price||0)*100)/100};}
    function updateSummary(){
      var short=0,over=0,counted=0;
      prods.forEach(function(p){var v=variance(p);if(v===null)return;counted++;
        if(v.value<0)short+=v.value;else over+=v.value;});
      clear(summary);
      summary.appendChild(statCard("Counted",String(counted)+" / "+prods.length,"products","blue","📋"));
      summary.appendChild(statCard("Shortage",money(Math.abs(short)),"missing stock at cost","red","📉"));
      summary.appendChild(statCard("Overage",money(over),"extra stock found","green","📈"));
      summary.appendChild(statCard("Net variance",money(Math.round((over+short)*100)/100),"at cost price",
        (over+short)<0?"red":"green","⚖️"));}
    function drawTable(){
      var q=(filterInp.value||"").trim().toLowerCase();
      var list=prods.filter(function(p){
        if(onlyCounted.checked&&counts[p.id]===undefined)return false;
        if(!q)return true;
        return (p.name_en||"").toLowerCase().indexOf(q)>-1||(p.barcode||"").indexOf(q)>-1;});
      clear(tableBox);
      tableBox.appendChild(table([
        {key:"name",label:t("common.name"),render:function(p){return el("div",{class:"flex"},[productThumb(p,"thumb-sm"),
          el("div",{},[el("div",{class:"t-main",text:p.name_en||p.name_ar}),
            el("div",{class:"t-sub",text:(p.barcode||"—")+" · cost "+money(p.purchase_price||0)})])]);}},
        {key:"sys",label:"System",num:true,render:function(p){return num(p.quantity,2);}},
        {key:"cnt",label:"Counted",num:true,render:function(p){
          var i=el("input",{type:"number",step:"any",style:"width:100px",
            value:counts[p.id]!==undefined?counts[p.id]:""});
          i.placeholder="—";
          i.addEventListener("input",function(){
            if(i.value===""){delete counts[p.id];}else counts[p.id]=parseFloat(i.value)||0;
            updateSummary();

            if(cell)cell.innerHTML=varHtml(p);});
          return i;}},
        {key:"var",label:"Variance",num:true,render:function(p){
          return el("div",{class:"var-cell",html:varHtml(p)});}}],list,{empty:"No products"}));}
    function varHtml(p){var v=variance(p);
      if(v===null)return "<span class='muted'>—</span>";
      if(v.diff===0)return badge("match","green");
      return "<span class='"+(v.diff<0?"down":"up")+"'>"+(v.diff>0?"+":"")+num(v.diff,2)+"</span>"+

    filterInp.addEventListener("input",drawTable);
    onlyCounted.addEventListener("change",drawTable);
    body.appendChild(el("div",{class:"card"},[
      el("div",{class:"section-head"},[el("h3",{text:"📋 Stocktake"}),
        el("div",{class:"flex",style:"flex-wrap:wrap"},[
          el("button",{class:"btn btn-ghost btn-sm",text:"⬇ Count sheet",onClick:function(){
            csvExport("count_sheet.csv",["barcode","product","system_qty","counted"],
              prods.map(function(p){return[p.barcode,p.name_en,p.quantity,""];}));}}),
          el("button",{class:"btn btn-ghost btn-sm",text:"⬇ Variance CSV",onClick:function(){
            var rows=[];prods.forEach(function(p){var v=variance(p);if(v===null)return;
              rows.push([p.barcode,p.name_en,p.quantity,counts[p.id],v.diff,p.purchase_price||0,v.value]);});
            if(!rows.length){toast("Count something first","error");return;}
            csvExport("variance.csv",["barcode","product","system","counted","variance","cost","value"],rows);}}),
          el("button",{class:"btn btn-primary",text:"Apply stocktake",onClick:apply})])]),
      el("div",{class:"toolbar"},[el("div",{class:"search-wrap"},filterInp),
        el("label",{class:"flex",style:"cursor:pointer"},[onlyCounted,el("span",{class:"hint",text:"Only counted rows"})]),
        el("label",{class:"flex",style:"cursor:pointer"},[bookLoss,el("span",{class:"hint",text:"Book shortages as a stock loss (hits profit)"})])]),
      summary,tableBox]));

    function apply(){
      var counted=[],short=0,over=0;
      prods.forEach(function(p){var v=variance(p);if(v===null||v.diff===0)return;

      if(!counted.length){toast("No differences to apply","error");return;}
      confirmModal("Apply "+counted.length+" adjustment(s)? Shortage "+money(Math.abs(short))+
        ", overage "+money(over)+".",function(){

        toast("Stocktake applied · "+counted.length+" products"+(lossTotal?(" · loss "+money(lossTotal)):""),"success");
        refreshNavBadges();draw();});}
    /* Past stocktakes */

        {key:"shortage",label:"Shortage",num:true,render:function(x){return money(x.shortage);}},
        {key:"overage",label:"Overage",num:true,render:function(x){return money(x.overage);}},
        {key:"loss_booked",label:"Loss booked",num:true,render:function(x){return money(x.loss_booked);}},
        {key:"user",label:"By"}],past.slice(0,50))]));}

/* ---- Expenses / Register / Zakat ---- */
var EXP_CATS=["Rent","Electricity","Water","Gas","Internet","Salaries","Fuel","Transport",
  "Restocking","Maintenance","Supplies","Miscellaneous"];

/* ---- Cash drawer movements ------------------------------------------------
   Money leaves and enters the drawer for reasons that are not sales: the owner
   takes cash out, a supplier is paid in cash at the door, a small expense is
   paid from the till, change is added in the morning. Every one is recorded so
   the counted drawer at closing time can be reconciled honestly.
   An owner withdrawal is NOT an expense — it moves money, it does not consume
   it — so it never touches profit. Expenses paid from the drawer create a
   normal expense record as well as the cash movement. */
var CASH_REASONS=[
  {key:"withdrawal",label:"Owner withdrawal",dir:"out",expense:false},
  {key:"supplier",label:"Supplier / restock paid in cash",dir:"out",expense:true,cat:"Restocking"},
  {key:"expense",label:"Expense paid from the till",dir:"out",expense:true,cat:"Miscellaneous"},
  {key:"bank",label:"Money taken to the bank",dir:"out",expense:false},
  {key:"float",label:"Change / float added",dir:"in",expense:false},
  {key:"other_in",label:"Other money in",dir:"in",expense:false},
  {key:"other_out",label:"Other money out",dir:"out",expense:false}];
function cashReason(key){return CASH_REASONS.filter(function(r){return r.key===key;})[0]||CASH_REASONS[0];}
function cashMoves(filterFn){return (DB.data.cash_moves||[]).filter(filterFn||function(){return true;});}
/* Net effect on the drawer of everything that is not a sale. */
function drawerAdjustment(filterFn){var n=0;
  cashMoves(filterFn).forEach(function(m){n+=(m.direction==="in"?1:-1)*(m.amount||0);});
  return round2(n);}
function addCashMove(v){
  var move={id:DB.nextId("cash_moves"),register_id:v.register_id||null,direction:v.direction,
    amount:round2(v.amount),reason:v.reason,label:v.label,note:v.note||"",expense_id:null,
    user:SESSION.user.username,created_at:new Date().toISOString()};
  /* Money spent on the business is also an expense; money the owner takes out
     is not, so profit stays truthful either way. */
  if(v.as_expense){
    var e={id:DB.nextId("expenses"),category:v.category||"Miscellaneous",amount:move.amount,
      spent_on:today(),note:(v.note?v.note+" — ":"")+"paid in cash from the till",
      user:SESSION.user.username,from_drawer:true};
    DB.data.expenses.unshift(e);move.expense_id=e.id;}
  DB.data.cash_moves=DB.data.cash_moves||[];
  DB.data.cash_moves.unshift(move);
  DB.save();log("cash_"+move.direction,"register",move.label+" "+move.amount);
  return move;}
function removeCashMove(id){
  var m=(DB.data.cash_moves||[]).filter(function(x){return x.id===id;})[0];
  if(!m)return;
  if(m.expense_id)DB.data.expenses=DB.data.expenses.filter(function(e){return e.id!==m.expense_id;});
  DB.data.cash_moves=DB.data.cash_moves.filter(function(x){return x.id!==id;});
  DB.save();log("cash_undo","register",m.label+" "+m.amount);}

function zReportData(dayISO,registerId){
  var day=dayISO||today();

    (registerId==null||s.register_id===registerId);});

  var voided=sales.filter(function(s){return s.status==="voided";});
  var byMethod={},gross=0,tax=0,disc=0,cost=0,profit=0,items=0;
  live.forEach(function(s){
    byMethod[s.payment_method]=(byMethod[s.payment_method]||0)+s.total;
    gross+=s.total;tax+=s.tax;disc+=s.discount;cost+=s.cost_total;profit+=s.profit;
    (s.items||[]).forEach(function(it){items+=it.quantity*(it.pack_units||1);});});
  var refunded=0;live.forEach(function(s){(s.items||[]).forEach(function(it){
    if(it.refunded_qty>0&&it.quantity)refunded+=it.line_total*(it.refunded_qty/it.quantity);});});
  var expenses=DB.data.expenses.filter(function(e){return e.spent_on===day;});
  var expTotal=expenses.reduce(function(a,e){return a+e.amount;},0);
  var losses=(DB.data.writeoffs||[]).filter(function(w){return dnorm(w.created_at)===day;});
  var lossTotal=losses.reduce(function(a,w){return a+w.loss_value;},0);

    top[it.name].qty+=it.quantity*(it.pack_units||1);top[it.name].total+=it.line_total;});});
  var topList=Object.keys(top).map(function(k){return top[k];}).sort(function(a,b){return b.total-a.total;}).slice(0,10);
  var regs=DB.data.registers.filter(function(r){return dnorm(r.opened_at)===day;});
  var cashSales=(byMethod.cash||0)+(byMethod.mixed||0);
  /* Cash that moved for reasons other than a sale, so the drawer figure on the
     report matches what is physically in the till. */
  var moves=cashMoves(function(m){return dnorm(m.created_at)===day&&
    (registerId==null||m.register_id===registerId);});
  var cashIn=0,cashOut=0;
  moves.forEach(function(m){if(m.direction==="in")cashIn+=m.amount;else cashOut+=m.amount;});

    net:round2(profit-expTotal-lossTotal),top:topList,registers:regs};}

/* Scan an item here to see exactly what the scanner sent and what the app
   made of it. This is the fastest way to spot a keyboard-layout mismatch,
   which turns every digit into a symbol. */
function scannerCheck(){
  var inp=el("input",{placeholder:"Scan any barcode now…",autocomplete:"off",
    style:"font-size:18px;letter-spacing:1px"});
  var out=el("div",{});
  var last="";
  function verdict(raw){
    clear(out);
    if(!raw){out.appendChild(el("div",{class:"hint",text:"Waiting for a scan…"}));return;}
    var fixed=scanDigits(raw);
    var hit=findByBarcode(fixed);
    var rows=[["What the scanner typed",raw],
      ["Characters",String(raw.length)],
      ["Read as",fixed],
      ["Looks like a barcode",isBarcodeLike(fixed)?"yes":"no"],
      ["Matches a product",hit?((hit.product.name_en||hit.product.name_ar)+(hit.isBox?" (case barcode)":"")):"no product with this code"]];
    out.appendChild(table([{key:"k",label:"Check"},{key:"v",label:"Result"}],
      rows.map(function(r){return{k:r[0],v:r[1]};})));
    if(fixed!==raw)
      out.appendChild(el("div",{class:"banner mt",
        html:"Your keyboard layout is not the one the scanner expects — it typed <strong>"+esc(raw)+
             "</strong> where it meant <strong>"+esc(fixed)+"</strong>. The app corrects this automatically, "+
             "so you can keep working. To fix it properly, set the scanner to the same keyboard layout as this computer "+
             "(its manual has a barcode for that)."}));
    else if(!isBarcodeLike(fixed))
      out.appendChild(el("div",{class:"banner banner-warn mt",
        text:"That does not look like a plain barcode. If the scanner adds a prefix or suffix, turn that off in its settings."}));
    else if(!hit)
      out.appendChild(el("div",{class:"banner mt",
        text:"The code was read cleanly. It just is not in the system yet — scan it at the till and the app will offer to add it."}));
    else out.appendChild(el("div",{class:"banner mt",text:"All good — the scanner and this computer agree."}));}
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();last=inp.value;verdict(last);inp.value="";inp.focus();}});
  inp.addEventListener("input",function(){if(inp.value.length>=6)verdict(inp.value);});
  verdict("");
  modal("🔎 Scanner check",el("div",{},[
    el("p",{class:"hint mb",text:"Point the scanner at any product and pull the trigger. Nothing is sold or changed here."}),
    inp,el("div",{class:"mt"},out)]),null,{large:true});
  setTimeout(function(){inp.focus();},80);}

function route(){var id=(location.hash||"#/dashboard").replace("#/","")||"dashboard";
  var item=NAV.filter(function(i){return i[0]===id;})[0];
  if(!item||!can(item[2])||!VIEWS[id]){id="dashboard";if(!can("dashboard")){var first=NAV.filter(function(i){return can(i[2]);})[0];if(first)id=first[0];}}
  var links=document.querySelectorAll("#nav a");for(var i=0;i<links.length;i++)links[i].classList.toggle("active",links[i].getAttribute("data-view")===id);
  setText(document.getElementById("page-title"),VIEWS[id].title());
  var sub=document.getElementById("page-sub");if(sub)setText(sub,PAGE_SUB[id]||"");
  document.getElementById("sidebar").classList.remove("open");var view=document.getElementById("view");view.scrollTop=0;
  view.classList.toggle("view-flush",id==="pos");
  try{VIEWS[id].render(view);}catch(e){view.innerHTML='<div class="empty">Error: '+esc(e.message)+"</div>";console.error(e);}
  refreshNavBadges();}

  for(var i=0;i<links.length;i++){var a=links[i],id=a.getAttribute("data-view");
    var old=a.querySelector(".nav-badge");if(old)old.remove();

/* ---- Scan anywhere ------------------------------------------------------
   A barcode scanner is a very fast keyboard. When characters arrive in a burst
   and finish with Enter while no field is focused, that is a scan and not
   someone typing — so the item goes straight into the basket, jumping to the
   till first if the cashier was looking at another screen. */
var GlobalScan={buf:"",last:0,MIN:4,GAP:140,
  key:function(e){
    if(e.ctrlKey||e.altKey||e.metaKey)return;
    var n=e.target,tag=n&&n.tagName;
    /* Never steal keys from a field, a dialog or the lock screen. */
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(n&&n.isContentEditable))return;
    if(document.querySelector(".modal-overlay")||document.getElementById("lock-screen"))return;
    if(!SESSION.user||!can("pos"))return;
    var now=Date.now();
    if(now-GlobalScan.last>GlobalScan.GAP)GlobalScan.buf="";
    GlobalScan.last=now;
    if(e.key==="Enter"){
      var code=GlobalScan.buf;GlobalScan.buf="";
      if(code.length>=GlobalScan.MIN){e.preventDefault();GlobalScan.fire(code);}
      return;}
    if(e.key.length===1&&(/[0-9A-Za-z]/.test(e.key)||LAYOUT_DIGITS[e.key]!==undefined)){
      GlobalScan.buf+=e.key;return;}
    GlobalScan.buf="";},
  fire:function(code){
    code=scanDigits(code);
    if(location.hash==="#/pos"&&window._posScan){window._posScan(code);return;}
    /* Not on the till: remember the code, switch, and the POS picks it up. */
    window._pendingScan=code;
    location.hash="#/pos";}};

function boot(){DB.load();
  if(!SESSION.user){renderLogin();return;}
  applyLang(SESSION.user_lang||SESSION.lang);applyTheme(SESSION.theme);
  renderShell();
  if(!window._globalScanOn){document.addEventListener("keydown",GlobalScan.key);window._globalScanOn=true;}
  window.onhashchange=route;
  if(!location.hash)location.hash="#/dashboard";route();
  LockScreen.reset();
  /* One automatic restore point per day. */
  setTimeout(function(){takeSnapshot("daily");},1500);
  /* First run: walk the owner through making this their own. */
  if(needsSetup()&&can("*")){
    setTimeout(function(){setupWizard(function(){renderShell();route();});},260);
  }else if(usingDefaultAdminPassword()&&can("*")){
    /* Never stack on top of something the cashier is dealing with (a restored
       basket, a reconnect prompt); wait until the screen is clear. */
    var nag=function(){
      if(document.querySelector(".modal-overlay")){setTimeout(nag,2500);return;}
      modal("🔐 Change the default password",
      el("div",{},[el("div",{class:"banner banner-warn",
        html:"The <strong>admin</strong> account is still using <strong>admin123</strong>. Anyone who knows it can open your books."}),
        el("p",{class:"hint",text:"Set a new password from the ⋯ menu → Change Password."})]),
      [{label:"Later",class:"btn-ghost"},{label:"Change it now",class:"btn-primary",onClick:changePassword}]);};
    setTimeout(nag,900);}}

/* ---------- Never show a blank screen ----------------------------------
   An unexpected error must not strand a cashier mid-shift. We report it,
   keep the data safe, and offer a way back. */
var _errCount=0;
function reportCrash(msg){
  _errCount++;
  try{console.error("KAKA POS:",msg);}catch(e){}
  if(_errCount>3)return;                       /* don't spam on a loop */
  try{toast("Something went wrong — your data is safe. "+(msg||""),"error");}catch(e){}
  /* If the shell never rendered, give a recovery screen rather than nothing. */
  var root=document.getElementById("root");
  if(root&&!document.getElementById("view")&&!document.querySelector(".login-card")){
    root.innerHTML="";
    root.appendChild(el("div",{style:"max-width:520px;margin:12vh auto;padding:24px"},[
      el("div",{class:"card"},[
        el("h3",{class:"mb",text:"⚠ The app could not start"}),
        el("p",{class:"hint mb",text:"Your saved data has not been touched. Try reloading; if it keeps happening, restore a snapshot or a backup."}),
        el("div",{class:"banner banner-warn",text:String(msg||"Unknown error")}),
        el("div",{class:"flex mt"},[
          el("button",{class:"btn btn-primary",text:"Reload",onClick:function(){location.reload();}}),
          el("button",{class:"btn btn-ghost",text:"Download my data",onClick:function(){
            try{var blob=new Blob([localStorage.getItem(STORE_KEY)||"{}"],{type:"application/json"});
              var a2=document.createElement("a");a2.href=URL.createObjectURL(blob);
              a2.download="kaka_rescue_"+today()+".json";a2.click();}catch(e){}}})])])]));}}
window.addEventListener("error",function(e){reportCrash(e&&e.message);});
window.addEventListener("unhandledrejection",function(e){
  var r=e&&e.reason;reportCrash(r&&(r.message||r));});

/* ---------- Auto-lock ---------------------------------------------------
   A cashier walks away; the takings should not be one click from anyone. */
var LockScreen={
  timer:null,
  minutes:function(){var m=parseInt(DB.data.settings.autolock_minutes);
    return isNaN(m)?10:m;},
  reset:function(){
    clearTimeout(this.timer);
    var mins=this.minutes();
    if(!mins||!SESSION.user)return;
    var self=this;
    this.timer=setTimeout(function(){self.lock();},mins*60*1000);},
  lock:function(){
    if(!SESSION.user||document.getElementById("lock-screen"))return;
    var user=SESSION.user;
    var pw=el("input",{type:"password",placeholder:"Password",
      style:"font-size:17px;text-align:center;max-width:260px;margin:0 auto"});
    var err=el("div",{class:"login-error",hidden:true});
    function unlock(){
      if(user.password!==hashPw(pw.value)){err.textContent="Wrong password";err.hidden=false;
        pw.value="";pw.focus();return;}
      var el2=document.getElementById("lock-screen");if(el2)el2.remove();
      LockScreen.reset();}
    pw.addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});
    var box=el("div",{id:"lock-screen",class:"lock-screen"},[
      el("div",{class:"login-card",style:"max-width:360px"},[
        el("div",{class:"login-logo",text:"🔒"}),
        el("h1",{text:"Screen locked"}),
        el("p",{class:"login-sub",text:(user.full_name||user.username)+" — enter your password to continue"}),
        pw,err,
        el("button",{class:"btn btn-primary btn-block",text:"Unlock",onClick:unlock}),
        el("button",{class:"btn btn-ghost btn-block",style:"margin-top:8px",text:"Sign out",
          onClick:function(){var l=document.getElementById("lock-screen");if(l)l.remove();
            logout();renderLogin();}})])]);
    document.body.appendChild(box);
    setTimeout(function(){pw.focus();},80);}
};
["click","keydown","mousemove","touchstart"].forEach(function(ev){
  document.addEventListener(ev,function(){LockScreen.reset();},{passive:true});});

/* Reconnect to the data file (if any) before the first render, so the app
   starts from what is on disk rather than the browser mirror. */
function start(){
  if(!FileStore.supported()){DB.load();EMOJI_OK=detectEmojiSupport();boot();return;}
  FileStore.restore().then(function(ok){
    if(!ok)return null;
    return FileStore.read();
  }).then(function(fileData){
    if(fileData&&fileData.products&&fileData.settings){
      DB.data=fileData;DB.migrate();
      try{localStorage.setItem(STORE_KEY,JSON.stringify(DB.data));}catch(e){}
      FileStore.setStatus("saved");
    }else{DB.load();}
    EMOJI_OK=detectEmojiSupport();
    boot();
  }).catch(function(){DB.load();EMOJI_OK=detectEmojiSupport();boot();});}

/* Never leave a queued write unfinished. */
window.addEventListener("beforeunload",function(e){
  if(FileStore.handle){clearTimeout(DB._fileTimer);FileStore.write(DB.data);}
  /* Do not let a half-rung sale disappear without a word. */
  try{var raw=localStorage.getItem(CART_KEY);
    if(raw&&JSON.parse(raw).cart.length){e.preventDefault();e.returnValue="";return "";}}catch(_){}}); 

start();
