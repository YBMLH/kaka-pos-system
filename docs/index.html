<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAKA POS — Standalone</title>
<!--
  KAKA POS — Standalone single-file build.
  Runs 100% in the browser. All data is stored locally in this browser
  (localStorage) — nothing is sent anywhere. This is the GitHub-Pages /
  download-and-open build; the full multi-terminal version is the Flask app
  in the repository root. Default login: admin / admin123
-->
<style>
/* ===== KAKA POS — design system ===================================== */
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
  --border:#e4e9f0; --border-strong:#cfd8e3;
  --text:#0f172a; --text-muted:#64748b; --text-soft:#94a3b8;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
  --success:#059669; --success-soft:#ecfdf5;
  --warning:#d97706; --warning-soft:#fffbeb;
  --danger:#e11d48; --danger-soft:#fff1f2;
  --info:#0284c7;
  --sidebar-bg:#111827; --sidebar-text:#9ca3af; --sidebar-hover:#1f2937;
  --shadow-xs:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 1px 3px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 16px 48px rgba(15,23,42,.18);
  --radius:14px; --radius-sm:10px; --radius-xs:8px; --radius-pill:999px;
  --fs:14px;
}
[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#121a2a; --surface-2:#182135; --surface-3:#1e293f;
  --border:#25314a; --border-strong:#35425e;
  --text:#e8edf7; --text-muted:#94a3b8; --text-soft:#64748b;
  --primary:#6366f1; --primary-dark:#818cf8; --primary-soft:#1e2440;
  --success:#10b981; --success-soft:#0d2a22;
  --warning:#f59e0b; --warning-soft:#2a2113;
  --danger:#fb7185; --danger-soft:#2d1520;
  --sidebar-bg:#070c17; --sidebar-text:#8593a8; --sidebar-hover:#161f33;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.55;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
[dir="rtl"] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
a{color:var(--primary);text-decoration:none;cursor:pointer}
h1,h2,h3,h4{font-weight:650;letter-spacing:-.02em;line-height:1.3}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-soft);background-clip:content-box}

/* ---- Forms ---- */
input,select,textarea{font-family:inherit;font-size:var(--fs);padding:10px 13px;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);
  color:var(--text);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--primary) 16%,transparent)}
input::placeholder{color:var(--text-soft)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:32px}
[dir="rtl"] select{background-position:16px 52%,21px 52%}
label{font-size:12.5px;color:var(--text-muted);font-weight:550}
.field{display:flex;flex-direction:column;gap:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:10px 16px;
  border:1.5px solid transparent;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;
  cursor:pointer;background:var(--surface-2);color:var(--text);width:auto;white-space:nowrap;
  transition:transform .12s,box-shadow .15s,background .15s,border-color .15s;font-family:inherit}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn-soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:var(--radius-xs)}
.btn-lg{padding:15px 22px;font-size:15.5px;border-radius:var(--radius)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  width:38px;height:38px;font-size:15px;cursor:pointer;color:var(--text);display:inline-flex;
  align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.mini-select{padding:8px 30px 8px 11px;width:auto;font-size:13px;font-weight:600}

/* ---- Login ---- */
.login-body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:radial-gradient(1200px 600px at 15% 10%,#4f46e5 0%,transparent 55%),
             radial-gradient(900px 500px at 85% 85%,#0ea5e9 0%,transparent 50%),#0b1120}
.login-wrap{width:100%;max-width:410px}
.login-card{background:var(--surface);border-radius:22px;padding:38px 34px;box-shadow:var(--shadow-lg);text-align:center}
.login-logo{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;display:flex;align-items:center;
  justify-content:center;font-size:30px;background:linear-gradient(135deg,var(--primary),#0ea5e9);
  color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 40%,transparent)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-sub{color:var(--text-muted);margin-bottom:22px;font-size:13px}
.login-card label{display:block;text-align:start;margin:14px 0 0;font-weight:600}
.login-card input{margin-top:6px}
.login-error{background:var(--danger-soft);color:var(--danger);padding:10px 13px;border-radius:var(--radius-sm);
  margin-top:14px;font-size:13px;font-weight:550}
.login-card .btn{margin-top:20px}
.login-hint{margin-top:18px;font-size:12px;color:var(--text-soft)}
.lang-switch{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.lang-switch button{background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-pill);
  padding:5px 14px;cursor:pointer;color:var(--text-muted);font-weight:600;font-size:12.5px;font-family:inherit;transition:.15s}
.lang-switch button:hover{border-color:var(--primary);color:var(--primary)}
.spinner{width:40px;height:40px;border:3.5px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;margin:80px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- App shell ---- */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--sidebar-bg);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;flex-shrink:0;z-index:50}
.brand{display:flex;align-items:center;gap:11px;padding:18px 20px 16px;color:#fff}
.brand-icon{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#0ea5e9);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-tag{font-size:10.5px;color:var(--sidebar-text);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav::-webkit-scrollbar{width:6px}
.nav-group-label{font-size:10px;font-weight:700;color:var(--sidebar-text);opacity:.6;
  text-transform:uppercase;letter-spacing:.09em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;color:var(--sidebar-text);
  font-size:13.5px;font-weight:550;border-radius:var(--radius-xs);margin-bottom:2px;transition:.13s}
.nav a:hover{background:var(--sidebar-hover);color:#fff}
.nav a.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 35%,transparent)}
.nav .nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-inline-start:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  border-radius:var(--radius-pill);padding:1px 6px;min-width:18px;text-align:center}
.nav a.active .nav-badge{background:rgba(255,255,255,.25)}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);background:rgba(255,255,255,.04)}
.user-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#0ea5e9);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.user-name{color:#fff;font-size:13px;font-weight:600;line-height:1.2}
.user-role{font-size:11px;color:var(--sidebar-text)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar h2{font-size:17.5px;line-height:1.2}
.page-sub{font-size:12px;color:var(--text-muted);font-weight:500}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
#menu-toggle{display:none}
.dropdown{position:relative}
.dropdown-menu{position:absolute;inset-inline-end:0;top:46px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  min-width:200px;padding:6px;display:none;z-index:30}
.dropdown-menu.open{display:block;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dropdown-menu a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--radius-xs);
  color:var(--text);font-size:13.5px;font-weight:550}
.dropdown-menu a:hover{background:var(--surface-2)}
.view{padding:24px;flex:1;overflow-y:auto}

/* ---- Cards, stats ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-xs)}
.grid{display:grid;gap:16px}
.stats-grid{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-xs);transition:.16s;position:relative;overflow:hidden}
.stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.stat-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px}
.stat-label{color:var(--text-muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.stat-value{font-size:25px;font-weight:720;letter-spacing:-.03em;line-height:1.15}
.stat-sub{font-size:12px;margin-top:5px;color:var(--text-soft);font-weight:500}
.stat-accent-blue .stat-icon{background:var(--primary-soft);color:var(--primary)}
.stat-accent-green .stat-icon{background:var(--success-soft);color:var(--success)}
.stat-accent-orange .stat-icon{background:var(--warning-soft);color:var(--warning)}
.stat-accent-red .stat-icon{background:var(--danger-soft);color:var(--danger)}
.up{color:var(--success);font-weight:650}.down{color:var(--danger);font-weight:650}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-head h3{font-size:15.5px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .grow{flex:1;min-width:180px}
.spacer{flex:1}
.hint{font-size:12.5px;color:var(--text-muted)}

/* ---- Search field with icon ---- */
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{padding-inline-start:38px}
.search-wrap::before{content:"🔍";position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.5;pointer-events:none}

/* ---- Chips / segmented ---- */
.chip-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 13px;border-radius:var(--radius-pill);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:.14s;font-family:inherit}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---- Tables ---- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-xs)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:12px 16px;text-align:start;white-space:nowrap}
th{background:var(--surface-2);color:var(--text-muted);font-weight:650;font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;border-bottom:1px solid var(--border)}
td{border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.t-main{font-weight:600}
.t-sub{font-size:11.5px;color:var(--text-soft);margin-top:2px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-pill);
  font-size:11.5px;font-weight:650;letter-spacing:.01em}
.badge-green{background:var(--success-soft);color:var(--success)}
.badge-red{background:var(--danger-soft);color:var(--danger)}
.badge-orange{background:var(--warning-soft);color:var(--warning)}
.badge-blue{background:var(--primary-soft);color:var(--primary)}
.badge-gray{background:var(--surface-3);color:var(--text-muted)}

/* ---- POS ---- */
.pos-layout{display:grid;grid-template-columns:1fr 420px;gap:0;height:calc(100vh - 67px)}
.pos-left{display:flex;flex-direction:column;gap:14px;min-height:0;padding:20px;overflow:hidden}
.pos-search{position:relative;flex-shrink:0}
.pos-search input{font-size:16px;padding:15px 17px 15px 46px;border-radius:var(--radius);
  box-shadow:var(--shadow-xs);border-width:2px}
.pos-search::before{content:"⌕";position:absolute;inset-inline-start:17px;top:50%;transform:translateY(-50%);
  font-size:22px;color:var(--text-soft);pointer-events:none;font-weight:700}
.pos-suggest{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  max-height:340px;overflow-y:auto;z-index:40;display:none;padding:6px}
.pos-suggest.open{display:block}
.pos-suggest-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 13px;cursor:pointer;border-radius:var(--radius-xs);transition:.1s}
.pos-suggest-item:hover,.pos-suggest-item.active{background:var(--primary);color:#fff}
.pos-suggest-item:hover .muted,.pos-suggest-item.active .muted{color:rgba(255,255,255,.8)}
.pos-scroll{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:11px;padding-bottom:8px}
.pos-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px;cursor:pointer;text-align:start;transition:.15s;box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;gap:2px;position:relative}
.pos-tile:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.pos-tile:active{transform:translateY(-1px)}
.pt-thumb{width:100%;height:56px;border-radius:var(--radius-xs);margin-bottom:8px;display:flex;
  align-items:center;justify-content:center;font-size:24px;background:var(--surface-3)}
.pt-name{font-weight:620;font-size:12.5px;line-height:1.35;height:34px;overflow:hidden;color:var(--text)}
.pt-price{color:var(--primary);font-weight:720;font-size:14.5px;margin-top:4px}
.pt-stock{font-size:11px;color:var(--text-soft);font-weight:550}
.pt-low{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--warning)}
.pt-box{margin-top:8px;width:100%;border:1.5px dashed var(--border-strong);background:var(--surface-2);
  color:var(--text-muted);border-radius:var(--radius-xs);padding:5px 6px;font-size:10.5px;font-weight:650;
  cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-box:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);border-style:solid}

.cart{background:var(--surface);border-inline-start:1px solid var(--border);display:flex;
  flex-direction:column;height:calc(100vh - 67px)}
.cart-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cart-head h3{font-size:15px}
.cart-items{flex:1;overflow-y:auto;padding:8px 10px}
.cart-empty{text-align:center;color:var(--text-soft);padding:48px 16px;font-size:13.5px}
.cart-empty .ce-icon{font-size:38px;display:block;margin-bottom:10px;opacity:.35}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 10px;
  border-radius:var(--radius-sm);transition:background .12s}
.cart-line:hover{background:var(--surface-2)}
.cart-line+.cart-line{border-top:1px solid var(--border)}
.cl-name{font-weight:620;font-size:13px;line-height:1.35}
.cl-controls{display:flex;align-items:center;gap:6px;margin-top:7px}
.qty-btn{width:28px;height:28px;border:1.5px solid var(--border);background:var(--surface);
  border-radius:var(--radius-xs);cursor:pointer;font-size:15px;color:var(--text);font-weight:600;
  display:flex;align-items:center;justify-content:center;transition:.13s;flex-shrink:0;font-family:inherit}
.qty-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.cart-line input.cl-qty{width:54px;text-align:center;padding:5px;font-weight:650;font-size:13px}
.cl-total{font-weight:700;text-align:end;align-self:center;font-size:14px;font-variant-numeric:tabular-nums}
.cl-remove{color:var(--text-soft);cursor:pointer;font-size:14px;text-align:end;margin-top:6px;transition:.13s}
.cl-remove:hover{color:var(--danger)}
.cart-foot{border-top:1px solid var(--border);padding:16px 18px;background:var(--surface-2)}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin:5px 0;font-size:13.5px;color:var(--text-muted)}
.cart-total-row span:last-child{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.cart-total-row.grand{font-size:21px;font-weight:750;margin:12px 0 4px;padding-top:12px;
  border-top:1.5px dashed var(--border-strong);color:var(--text);letter-spacing:-.02em}
.cart-total-row.grand span:last-child{font-weight:750;font-size:21px;color:var(--primary)}
.cart-actions{display:grid;grid-template-columns:auto 1fr;gap:9px;margin-top:14px}

/* ---- Modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(8,12,22,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;
  max-width:520px;max-height:92vh;display:flex;flex-direction:column;animation:rise .2s cubic-bezier(.3,1.3,.5,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal.modal-lg{max-width:840px}
.modal-head{padding:18px 22px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{font-size:16.5px}
.modal-body{padding:4px 22px 20px;overflow-y:auto}
.modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.modal-close{cursor:pointer;font-size:20px;color:var(--text-soft);background:var(--surface-2);border:none;
  width:32px;height:32px;border-radius:var(--radius-xs);flex-shrink:0;transition:.14s;line-height:1}
.modal-close:hover{background:var(--surface-3);color:var(--text)}

/* ---- Toast ---- */
.toast-root{position:fixed;bottom:22px;inset-inline-end:22px;display:flex;flex-direction:column;gap:10px;z-index:300}
.toast{background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--primary);
  border-radius:var(--radius-sm);padding:13px 18px;box-shadow:var(--shadow-lg);min-width:250px;
  max-width:360px;font-size:13.5px;font-weight:550;animation:slidein .22s cubic-bezier(.3,1.2,.5,1);transition:opacity .3s}
.toast.success{border-inline-start-color:var(--success)}
.toast.error{border-inline-start-color:var(--danger)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ---- Charts ---- */
.chart{display:flex;align-items:flex-end;gap:5px;height:210px;padding:12px 0 0}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.chart-bar{width:100%;background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 65%,transparent));
  border-radius:5px 5px 2px 2px;min-height:3px;transition:.25s;cursor:pointer}
.chart-bar:hover{filter:brightness(1.15)}
.chart-bar.profit{background:linear-gradient(180deg,var(--success),color-mix(in srgb,var(--success) 60%,transparent))}
.chart-label{font-size:9.5px;color:var(--text-soft);white-space:nowrap;font-weight:550}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text-muted);font-weight:550}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:5px}

/* ---- Misc ---- */
.health-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.health-green{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.health-orange{background:var(--warning);box-shadow:0 0 0 3px var(--warning-soft)}
.health-red{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.empty{text-align:center;color:var(--text-soft);padding:44px 20px;font-size:13.5px}
.muted{color:var(--text-muted)}
.right{text-align:end}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.flex{display:flex;gap:9px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:5px;border-radius:var(--radius);
  margin-bottom:20px;flex-wrap:wrap;border:1px solid var(--border)}
.tab{padding:8px 15px;cursor:pointer;border-radius:var(--radius-xs);color:var(--text-muted);
  font-size:13px;font-weight:600;transition:.14s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);background:var(--surface);box-shadow:var(--shadow-xs)}
.banner{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);
  color:var(--text);border-radius:var(--radius-sm);padding:12px 15px;font-size:13px;margin-bottom:16px;font-weight:500}
.banner-warn{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 30%,transparent)}
kbd{background:var(--surface-3);border:1px solid var(--border-strong);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:11px;font-family:ui-monospace,monospace;font-weight:600;color:var(--text-muted)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}

/* ---- Responsive ---- */
@media(max-width:1100px){.pos-layout{grid-template-columns:1fr 360px}}
@media(max-width:900px){
  .sidebar{position:fixed;inset-inline-start:0;transform:translateX(-100%);transition:transform .24s ease;box-shadow:var(--shadow-lg)}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  #menu-toggle{display:inline-flex}
  .pos-layout{grid-template-columns:1fr;height:auto}
  .cart{height:auto;border-inline-start:none;border-top:1px solid var(--border)}
  .form-grid{grid-template-columns:1fr}
  .view{padding:16px}
  .topbar{padding:12px 16px}
  .toast-root{inset-inline:14px;bottom:14px}
  .toast{max-width:none}
}
@media print{.sidebar,.topbar,.toast-root,.toolbar,.cart-actions{display:none!important}.view{padding:0}}

var ARABIC_MAP={"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه"};
var ARABIC_DIAC=/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
function stripAccents(s){return s.normalize("NFKD").replace(/[̀-ͯ]/g,"");}
function normalize(s){if(!s)return"";s=(""+s).trim().toLowerCase();s=s.replace(ARABIC_DIAC,"");
  s=s.replace(/[؀-ۿ]/g,function(c){return ARABIC_MAP[c]||c;});s=stripAccents(s);
  return s.replace(/[^0-9a-z؀-ۿ]+/g,"");}
function searchBlob(){var out=[],seen={};for(var i=0;i<arguments.length;i++){var n=normalize(arguments[i]);
  if(n&&!seen[n]){seen[n]=1;out.push(n);}}return out.join(" ");}
function levenshtein(a,b){if(a===b)return 0;if(!a)return b.length;if(!b)return a.length;
  var prev=[];for(var j=0;j<=b.length;j++)prev[j]=j;
  for(var i=0;i<a.length;i++){var cur=[i+1];for(var k=0;k<b.length;k++){
    cur[k+1]=Math.min(prev[k+1]+1,cur[k]+1,prev[k]+(a[i]!==b[k]?1:0));}prev=cur;}return prev[b.length];}

function login(username,password){

/* ---------- Inventory helper (single source of truth) ------------------ */
function adjustStock(productId,change,reason,note){
  var p=DB.data.products.filter(function(x){return x.id===productId;})[0];if(!p)return null;
  p.quantity=(p.quantity||0)+change;
  DB.data.movements.unshift({id:DB.nextId("movements"),product_id:productId,product_name:p.name_en,
    change_qty:change,balance:p.quantity,reason:reason,note:note||"",
    user:SESSION.user?SESSION.user.username:"",created_at:new Date().toISOString()});
  return p.quantity;}

/* ---------- Case / box packaging ---------------------------------------
   Stock is always held in base units (pieces). A product may additionally be
   bought and sold as a case: `units_per_box` pieces per case, an optional
   separate `box_barcode` printed on the outer carton, and an optional
   `box_price`. When no box price is set we fall back to units x unit price. */
function hasBox(p){return (p.units_per_box||0)>1;}
function packName(p){return p.pack_name||"Box";}
function boxPrice(p){return (p.box_price>0)?p.box_price:(p.units_per_box||0)*(p.selling_price||0);}
function boxCost(p){return (p.units_per_box||0)*(p.purchase_price||0);}
/* Per-piece price when buying a whole case — shows the customer's saving. */
function boxUnitPrice(p){var u=p.units_per_box||0;return u?boxPrice(p)/u:0;}
function boxSavingPct(p){var sp=p.selling_price||0;if(!hasBox(p)||!sp)return 0;
  return Math.round((1-boxUnitPrice(p)/sp)*1000)/10;}
/* "3 Box + 12 pcs" — how a shopkeeper actually counts the shelf. */
function fmtStock(p){var q=p.quantity||0;var u=p.units_per_box||0;
  if(u>1){var b=Math.floor(q/u),r=Math.round((q-b*u)*100)/100;
    return (b?b+" "+packName(p)+(b>1?"es":""):"")+(b&&r?" + ":"")+(r||!b?num(r,r%1?2:0)+" "+p.unit:"");}
  return num(q,q%1?2:0)+" "+p.unit;}
function stockTitle(p){return hasBox(p)?(num(p.quantity,2)+" "+p.unit+" total · "+p.units_per_box+" "+p.unit+" per "+packName(p)):"";}

/* ---------- Product search --------------------------------------------- */
/* Resolve any scanned code: piece barcode, case barcode, or SKU. */
function findByBarcode(code){code=(code||"").trim();if(!code)return null;
  var p=DB.data.products.filter(function(x){return!x.archived&&x.barcode===code;})[0];
  if(p)return{product:p,isBox:false};
  p=DB.data.products.filter(function(x){return!x.archived&&x.box_barcode&&x.box_barcode===code;})[0];
  if(p)return{product:p,isBox:true};
  return null;}
function searchProducts(term,limit){limit=limit||15;term=(term||"").trim();if(!term)return{products:[]};
  var hit=findByBarcode(term);
  if(hit)return{products:[hit.product],exact_barcode:true,isBox:hit.isBox};
  var norm=normalize(term);
  var rows=DB.data.products.filter(function(p){if(p.archived)return false;
    return(p.search_blob||"").indexOf(norm)>-1||(p.sku||"").toLowerCase().indexOf(term.toLowerCase())>-1||
      (p.barcode||"").indexOf(term)>-1||(p.box_barcode||"").indexOf(term)>-1;});
  rows.sort(function(a,b){function sc(r){var blob=r.search_blob||"";if(blob.indexOf(norm)===0)return 0;
    var best=99;blob.split(" ").forEach(function(tok){best=Math.min(best,levenshtein(norm,tok));});return 1+best/100;}
    return sc(a)-sc(b);});
  return{products:rows.slice(0,limit)};}
function serializeProduct(p){var d={};for(var k in p)d[k]=p[k];var sp=p.selling_price||0,pp=p.purchase_price||0;
  d.profit_margin=sp?Math.round((sp-pp)/sp*10000)/100:0;d.profit_unit=Math.round((sp-pp)*100)/100;
  d.low_stock=(p.quantity||0)<=(p.min_stock||0);
  var c=DB.data.categories.filter(function(x){return x.id===p.category_id;})[0];d.category_name=c?c.name:"";
  return d;}

/* ---------- Date/period analytics -------------------------------------- */
function completedSales(){return DB.data.sales.filter(function(s){return s.status==="completed"||s.status==="partial_refund";});}
function inPeriod(iso,period){var d=new Date(iso);var now=new Date();
  var dd=dnorm(iso);var td=today();
  if(period==="today")return dd===td;
  if(period==="yesterday"){var y=new Date();y.setDate(y.getDate()-1);return dd===y.toISOString().slice(0,10);}
  if(period==="week"){var monday=new Date();var day=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-day);
    monday.setHours(0,0,0,0);return d>=monday;}
  if(period==="month")return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(period==="quarter")return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/3)===Math.floor(now.getMonth()/3);
  if(period==="half")return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/6)===Math.floor(now.getMonth()/6);
  if(period==="year")return d.getFullYear()===now.getFullYear();
  return true;}
function salesMetrics(filterFn){var m={orders:0,revenue:0,cost:0,gross_profit:0,tax:0,discount:0};
  completedSales().forEach(function(s){if(filterFn&&!filterFn(s))return;m.orders++;m.revenue+=s.total;
    m.cost+=s.cost_total;m.gross_profit+=s.profit;m.tax+=s.tax;m.discount+=s.discount;});
  ["revenue","cost","gross_profit","tax","discount"].forEach(function(k){m[k]=Math.round(m[k]*100)/100;});return m;}
function expenseTotal(filterFn){var t=0;DB.data.expenses.forEach(function(e){if(filterFn&&!filterFn(e))return;t+=e.amount;});return Math.round(t*100)/100;}
function inventoryValue(){var cost=0,retail=0,units=0,count=0;
  DB.data.products.forEach(function(p){if(p.archived)return;count++;units+=p.quantity;
    cost+=p.quantity*p.purchase_price;retail+=p.quantity*p.selling_price;});
  return{cost_value:Math.round(cost*100)/100,retail_value:Math.round(retail*100)/100,total_units:units,products:count};}

"232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133",
"112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131",
"311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422",
"121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211",
"221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212",
"421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113",
"411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128SVG(data,opts){opts=opts||{};data=""+data;if(!data)return "";
  for(var i=0;i<data.length;i++){var c=data.charCodeAt(i);if(c<32||c>126)return "";}
  var codes=[104],sum=104;for(i=0;i<data.length;i++){var v=data.charCodeAt(i)-32;codes.push(v);sum+=v*(i+1);}
  codes.push(sum%103);codes.push(106);
  var mw=opts.mw||2,h=opts.height||40,quiet=10*mw,x=quiet,bar=true,rects="";
  codes.forEach(function(code){var pat=C128[code];for(var k=0;k<pat.length;k++){var w=parseInt(pat[k],10)*mw;
    if(bar)rects+='<rect x="'+x+'" y="0" width="'+w+'" height="'+h+'"/>';x+=w;bar=!bar;}});
  var total=x+quiet;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+total+'" height="'+h+'" viewBox="0 0 '+total+' '+h+'">'+
    '<rect width="'+total+'" height="'+h+'" fill="#fff"/><g fill="#000">'+rects+'</g></svg>';}

/* Navigation grouped into meaningful sections so the sidebar reads as an

  {label:"nav.grp_catalog",items:[["products","📦","products.view"],["inventory","📋","inventory"]]},
  {label:"nav.grp_buying",items:[["purchases","🚚","purchases"],["suppliers","🏭","suppliers"]]},

function navLabel(id){var k="nav."+id;var v=t(k);return v!==k?v:(id.charAt(0).toUpperCase()+id.slice(1));}
/* Small contextual counts shown as sidebar badges (e.g. low-stock alerts). */
function navBadge(id){
  if(id==="products"||id==="inventory"){
    var n=DB.data.products.filter(function(p){return!p.archived&&p.min_stock>0&&p.quantity<=p.min_stock;}).length;
    return n||0;}
  if(id==="pos")return (DB.data._held||[]).length;
  return 0;}
var PAGE_SUB={dashboard:"Business overview",pos:"Sell and take payment",products:"Your catalog",
  inventory:"Stock levels and movements",purchases:"Orders and receiving",suppliers:"Vendors and balances",
  customers:"Customer accounts",history:"Past sales and refunds",expenses:"Money going out",
  reports:"Analyze your business",register:"Cash drawer sessions",zakat:"Zakat calculator",
  users:"Team, audit log and backups",settings:"Store configuration"};

function applyLang(lang){SESSION.lang=lang;localStorage.setItem("kaka_lang",lang);
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";}
function applyTheme(theme){SESSION.theme=theme;localStorage.setItem("kaka_theme",theme);document.body.setAttribute("data-theme",theme);}

  {name:"next",label:"New Password",type:"password",full:true}]);

function route(){var id=(location.hash||"#/dashboard").replace("#/","")||"dashboard";
  var item=NAV.filter(function(i){return i[0]===id;})[0];
  if(!item||!can(item[2])||!VIEWS[id]){id="dashboard";if(!can("dashboard")){var first=NAV.filter(function(i){return can(i[2]);})[0];if(first)id=first[0];}}
  var links=document.querySelectorAll("#nav a");for(var i=0;i<links.length;i++)links[i].classList.toggle("active",links[i].getAttribute("data-view")===id);
  document.getElementById("page-title").textContent=VIEWS[id].title();
  var sub=document.getElementById("page-sub");if(sub)sub.textContent=PAGE_SUB[id]||"";
  document.getElementById("sidebar").classList.remove("open");var view=document.getElementById("view");view.scrollTop=0;
  try{VIEWS[id].render(view);}catch(e){view.innerHTML='<div class="empty">Error: '+esc(e.message)+"</div>";console.error(e);}
  refreshNavBadges();}
/* Keep sidebar badges in sync after actions change stock / held sales. */
function refreshNavBadges(){var links=document.querySelectorAll("#nav a");
  for(var i=0;i<links.length;i++){var a=links[i],id=a.getAttribute("data-view");
    var old=a.querySelector(".nav-badge");if(old)old.remove();
    var n=navBadge(id);if(n)a.appendChild(el("span",{class:"nav-badge",text:n>99?"99+":String(n)}));}}

function boot(){DB.load();
  if(!SESSION.user){renderLogin();return;}
  applyLang(SESSION.user_lang||SESSION.lang);applyTheme(SESSION.theme);
  renderShell();
  window.onhashchange=route;
  if(!location.hash)location.hash="#/dashboard";route();}

DB.load();boot();
